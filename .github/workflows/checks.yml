name: GPU-free checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-checks:
    name: python-checks (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            tests: tests/contract tests/unit tests/gateway/test_evaluation_api.py tests/gateway/test_info.py
          - lane: gateway
            tests: >-
              tests/gateway
              --ignore=tests/gateway/test_binding_templates.py
              --ignore=tests/gateway/test_template_pin_history.py
              --ignore=tests/gateway/test_template_previews.py
              --ignore=tests/gateway/test_builtin_template_migration.py
              --ignore=tests/gateway/test_template_asset_references.py
              --ignore=tests/gateway/test_library_deletions.py
              --ignore=tests/gateway/test_asset_imports.py
              --ignore=tests/gateway/test_structure_validation.py
              --ignore=tests/gateway/test_evaluation_api.py
              --ignore=tests/gateway/test_info.py
          - lane: library-templates
            tests: >-
              tests/gateway/test_binding_templates.py
              tests/gateway/test_template_pin_history.py
              tests/gateway/test_template_previews.py
              tests/gateway/test_builtin_template_migration.py
              tests/gateway/test_template_asset_references.py
              tests/gateway/test_asset_imports.py
              tests/gateway/test_structure_validation.py
          - lane: cli
            tests: tests/cli tests/gateway/test_library_deletions.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        if: matrix.lane == 'core'
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        if: matrix.lane == 'core'
      - name: Install frozen Python dependencies from PyPI
        run: |
          uv export --frozen --group dev --no-emit-project --output-file "$RUNNER_TEMP/spatial-requirements.txt" > /dev/null
          uv venv --python 3.13
          uv pip install --python .venv/bin/python --index-url https://pypi.org/simple --require-hashes -r "$RUNNER_TEMP/spatial-requirements.txt"
          uv pip install --python .venv/bin/python --index-url https://pypi.org/simple --no-deps -e .
      - run: pnpm install --frozen-lockfile
        if: matrix.lane == 'core'
      - run: uv run --no-sync python -m pytest ${{ matrix.tests }} -q
      - run: uv run --no-sync ruff check apps packages tools tests
        if: matrix.lane == 'core'
      - run: uv run --no-sync python tools/check_platform_skills.py
        if: matrix.lane == 'core'
      - run: pnpm protocol:check
        if: matrix.lane == 'core'
      - run: pnpm test:protocol:ts
        if: matrix.lane == 'core'
      - run: pnpm test:web
        if: matrix.lane == 'core'
      - run: pnpm build
        if: matrix.lane == 'core'

  contracts:
    if: always()
    needs: [python-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every Python lane and core check
        env:
          PYTHON_RESULT: ${{ needs.python-checks.result }}
        run: test "$PYTHON_RESULT" = success

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install frozen Python dependencies from PyPI
        run: |
          uv export --frozen --group dev --no-emit-project --output-file "$RUNNER_TEMP/spatial-requirements.txt" > /dev/null
          uv venv --python 3.13
          uv pip install --python .venv/bin/python --index-url https://pypi.org/simple --require-hashes -r "$RUNNER_TEMP/spatial-requirements.txt"
          uv pip install --python .venv/bin/python --index-url https://pypi.org/simple --no-deps -e .
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Browser acceptance against SyntheticSource
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}/6
          SPATIAL_RECORDINGS_ROOT: .scratch/viewer-e2e/recordings
          SPATIAL_STATE_ROOT: .scratch/viewer-e2e/state
          SPATIAL_TEST_APPROVAL: '1'
          SPATIAL_E2E_WEB_MODE: preview
        run: |
          uv run --no-sync python -m uvicorn approval_gateway:app --app-dir tests/fixtures --host 127.0.0.1 --port 8000 > /tmp/spatial-api.log 2>&1 &
          SPATIAL_API_PID=$!
          trap 'kill "$SPATIAL_API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then break; fi
            sleep 0.5
          done
          curl --fail http://127.0.0.1:8000/api/v1/health
          # Split the same individual cases across six shards; each gateway keeps one test worker.
          SPATIAL_E2E_VIDEO=0 pnpm test:e2e --fully-parallel --workers=1 --shard="$PLAYWRIGHT_SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance-evidence-${{ matrix.shard }}
          path: |
            /tmp/spatial-api.log
            .scratch/viewer-e2e/report
            .scratch/viewer-e2e/results

  contract-gateway-viewer:
    if: always()
    needs: [contracts, browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every contract and browser shard
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          BROWSER_RESULT: ${{ needs.browser-acceptance.result }}
        run: |
          test "$CONTRACTS_RESULT" = success
          test "$BROWSER_RESULT" = success
