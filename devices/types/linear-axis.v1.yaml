type: linear-axis/v1
title: Linear rail
description: A separately owned meter-valued rail with nominal command travel 0–2.95m.
  Feedback remains measured and unclamped. Joint positioning alone proves no path clearance.
properties:
  phase: {schema: {enum: [idle, moving, stopping, fault]}}
  positionM: {schema: {type: number}, unit: m, deadband: 0.0001, maxRateHz: 10}
  velocityMPerSecond: {schema: {type: number}, unit: m/s, deadband: 0.0001, maxRateHz: 10}
actions:
  moveTo:
    params:
      positionM: {type: number, minimum: 0, maximum: 2.95}
      durationSeconds: &duration {type: number, minimum: 0.05, maximum: 120}
    required: [positionM, durationSeconds]
    longRunning: true
    timeoutSeconds: 180
    preconditions: [{property: phase, equals: idle}]
  home:
    params: {durationSeconds: *duration}
    required: []
    longRunning: true
    timeoutSeconds: 180
    preconditions: [{property: phase, equals: idle}]
  stop:
    params: {}
    required: []
    concurrent: true
    longRunning: true
    timeoutSeconds: 40
events: {}
