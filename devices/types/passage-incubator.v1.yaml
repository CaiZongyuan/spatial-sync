type: passage-incubator/v1
title: Passage incubator signals
alerts:
  tempDeviation:
    when:
      all:
      - property: temperatureC
        deviatesFrom: setpointC
        by: 1.0
    forSeconds: 60
    severity: critical
    message: "\u6E29\u5EA6\u504F\u79BB\u8BBE\u5B9A\u503C\u8D85\u8FC7 1 \xB0C"
    hint: "\u68C0\u67E5\u95E8\u662F\u5426\u5173\u95ED"
  doorOpen:
    when:
      property: doorOpen
      equals: true
    forSeconds: 120
    severity: warning
    message: "\u57F9\u517B\u7BB1\u95E8\u6253\u5F00\u8D85\u8FC7 120 s"
description: Seeded teaching signal model. Mechanical door facts are separate; no
  measured environmental sensor claim.
properties:
  co2SetpointPercent:
    schema: {type: number, minimum: 0, maximum: 20}
    unit: '%'
  humiditySetpointPercent:
    schema: {type: number, minimum: 0, maximum: 100}
    unit: '%'
  temperatureReadyRangeC:
    schema: &range
      type: array
      items: {type: number}
      minItems: 2
      maxItems: 2
  co2ReadyRangePercent:
    schema: *range
  humidityReadyRangePercent:
    schema: *range
  phase:
    schema:
      enum: [idle, waiting]
  waitElapsedSeconds:
    schema:
      type: number
      minimum: 0
    unit: s
  temperatureC:
    schema:
      type: number
      minimum: 0
      maximum: 80
    unit: "\xB0C"
    deadband: 0.02
    maxRateHz: 5
    staleAfterSeconds: 3
  co2Percent:
    schema:
      type: number
      minimum: 0
      maximum: 20
    unit: '%'
    deadband: 0.002
    maxRateHz: 5
    staleAfterSeconds: 3
  humidityPercent:
    schema:
      type: number
      minimum: 0
      maximum: 100
    unit: '%'
    deadband: 0.03
    maxRateHz: 5
    staleAfterSeconds: 3
  doorOpen:
    schema:
      type: boolean
    staleAfterSeconds: 3
    description: True if either actual Newton door is open, moving or unknown.
  setpointC:
    schema:
      type: number
      minimum: 20
      maximum: 60
    unit: "\xB0C"
    staleAfterSeconds: 3
  environmentReady:
    schema:
      type: boolean
  controlSafe:
    schema:
      type: boolean
  signalSource:
    schema:
      enum:
      - modeled
  doorKnown:
    schema:
      type: boolean
actions:
  waitReady:
    params:
      owner: {type: string}
      epoch: {type: integer, minimum: 0}
      operationId: {type: string}
      timeoutSeconds: {type: number, minimum: 1, maximum: 600}
    required: [owner, epoch, operationId]
    longRunning: true
    timeoutSeconds: 660
  setSetpoint:
    description: Set the temperature target using a fresh temperature reading.
    params:
      temperatureC:
        type: number
        minimum: 20
        maximum: 60
        unit: "\xB0C"
      owner:
        type: string
      epoch:
        type: integer
        minimum: 0
      operationId:
        type: string
    required:
    - temperatureC
    - owner
    - epoch
    - operationId
    preconditions:
    - property: temperatureC
      notNull: true
    risk: high
