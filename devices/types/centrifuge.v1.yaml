type: centrifuge/v1
title: Bench centrifuge
description: Four slots require zero, two opposite, or four tubes. Visual speed capped
  at 60 rpm; rotor stops on a whole revolution.
properties:
  phase:
    schema:
      enum:
      - idle
      - accelerating
      - running
      - decelerating
      - fault
  lidOpen:
    schema:
      type: boolean
  rpm:
    schema:
      type: number
      minimum: 0
      maximum: 15000
    unit: rpm
    deadband: 10
    maxRateHz: 5
  remainingSeconds:
    schema:
      type: number
      minimum: 0
    unit: s
    maxRateHz: 1
  slots:
    schema:
      type: array
      items:
        type:
        - string
        - 'null'
      minItems: 4
      maxItems: 4
actions:
  openLid:
    params: {}
    required: []
    preconditions:
    - property: phase
      equals: idle
      message: Wait for the rotor to stop before opening the lid
    timeoutSeconds: 5
  closeLid:
    params: {}
    required: []
    preconditions:
    - property: phase
      equals: idle
    timeoutSeconds: 5
  start:
    params:
      rpm:
        type: number
        minimum: 500
        maximum: 15000
        unit: rpm
      durationSeconds:
        type: number
        minimum: 1
        maximum: 3600
        unit: s
    required:
    - rpm
    - durationSeconds
    preconditions:
    - property: lidOpen
      equals: false
      message: The lid is open; call closeLid first
    - property: phase
      equals: idle
    longRunning: true
    timeoutSeconds: 3700
    description: Run then decelerate; imbalanced rejects nonopposite loading.
  stop:
    params: {}
    required: []
    concurrent: true
events:
  runCompleted:
    schema:
      type: object
      properties:
        rpm:
          type: number
        durationSeconds:
          type: number
      required:
      - rpm
      - durationSeconds
