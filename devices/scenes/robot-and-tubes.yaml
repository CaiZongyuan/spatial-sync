    - /World/Lab/Rack/A4
    - /World/Lab/Rack/B1
    - /World/Lab/Rack/B2
    - /World/Lab/Rack/B3
    - /World/Lab/Rack/B4
    - /World/Lab/Centrifuge/Rotor/Slot1
    - /World/Lab/Centrifuge/Rotor/Slot2
    - /World/Lab/Centrifuge/Rotor/Slot3
    - /World/Lab/Centrifuge/Rotor/Slot4
