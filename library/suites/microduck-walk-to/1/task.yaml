name: microduck-walk-to
scene: microduck-arena@1
robot: /World/Lab/Microduck
implements: biped/v1.walkTo
timeoutSeconds: 20
success:
  all:
    - {property: fallen, equals: false}
    - {property: lastCompletedAction, equals: walkTo}
    - {property: currentWaypoint, notNull: true}
milestones:
  - id: walking
    when: {property: phase, equals: walking}
  - id: arrived
    when: {property: currentWaypoint, notNull: true}
