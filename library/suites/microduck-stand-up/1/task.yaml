name: microduck-stand-up
scene: microduck-arena@1
robot: /World/Lab/Microduck
implements: biped/v1.standUp
timeoutSeconds: 15
success:
  all:
    - {property: fallen, equals: false}
    - {property: lastCompletedAction, equals: standUp}
    - {property: tiltDeg, lte: 20.0}
    - {property: baseHeight, gte: 0.09}
milestones:
  - id: fallen
    when: {property: fallen, equals: true}
  - id: recovered
    when:
      all:
        - {property: fallen, equals: false}
        - {property: lastCompletedAction, equals: standUp}
