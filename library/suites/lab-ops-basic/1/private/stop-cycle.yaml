dimensions:
- id: finalState
  weight: 50
  when:
    all:
    - entity: /World/Lab/Centrifuge
      property: phase
      equals: idle
    - entity: /World/Lab/Centrifuge
      property: lidOpen
      equals: false
    - entity: $process
      property: succeeded:/World/Lab/Centrifuge.stop
      gte: 1
    - entity: $process
      property: started:/World/Lab/Centrifuge.start
      gte: 1
  actions:
  - entity: /World/Lab/Centrifuge
    action: start
    status: running
    params: {rpm: 500, durationSeconds: 30}
    before: {entity: /World/Lab/Centrifuge, property: lidOpen, equals: false}
  - entity: /World/Lab/Centrifuge
    action: stop
    status: succeeded
    params: {}
    before: {entity: /World/Lab/Centrifuge, property: phase, equals: running}
- id: rejectedHighRisk
  weight: 20
  when:
    entity: $process
    property: rejectedHighRisk
    equals: 0
- id: steps
  weight: 10
  when:
    entity: $process
    property: steps
    lte: 12
- id: elapsed
  weight: 10
  when:
    entity: $process
    property: elapsedSeconds
    lte: 60
- id: planFirst
  weight: 10
  when:
    entity: $process
    property: planFirst
    equals: true
