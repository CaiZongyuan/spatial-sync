name: microduck-bow
scene: microduck-arena@1
robot: /World/Lab/Microduck
implements: biped/v1.bow
timeoutSeconds: 12
success:
  all:
    - {property: fallen, equals: false}
    - {property: lastCompletedAction, equals: bow}
    - {property: tiltDeg, lte: 20.0}
    - {property: baseHeight, gte: 0.09}
milestones:
  - id: bowed
    when: {property: pitchDeg, gte: 12.0}
