    tubes:
    - /World/Lab/Tubes/Tube01
    - /World/Lab/Tubes/Tube02
    - /World/Lab/Tubes/Tube03
    - /World/Lab/Tubes/Tube04
    - /World/Lab/Tubes/Tube05
    - /World/Lab/Tubes/Tube06
    - /World/Lab/Tubes/Tube07
    - /World/Lab/Tubes/Tube08
    - /World/Lab/Tubes/Tube09
    - /World/Lab/Tubes/Tube10
    - /World/Lab/Tubes/Tube11
