    - /World/Lab/Tubes/Tube13
    - /World/Lab/Tubes/Tube14
    - /World/Lab/Tubes/Tube15
    - /World/Lab/Tubes/Tube16
    - /World/Lab/Tubes/Tube17
    - /World/Lab/Tubes/Tube18
    - /World/Lab/Tubes/Tube19
    - /World/Lab/Tubes/Tube20
  interlocks:
    closeLid:
    - entity: /World/Lab/RobotA
      property: zone
      notEquals: centrifuge
      message: Move the arm out of the centrifuge zone first
  template: device/lab-centrifuge-reference@1
- match: /World/Lab/Tubes/*
