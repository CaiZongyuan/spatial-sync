      /World/Lab/Tubes/Tube04: /World/Lab/Rack/A4
      /World/Lab/Tubes/Tube05: /World/Lab/Rack/B1
      /World/Lab/Tubes/Tube06: /World/Lab/Rack/B2
      /World/Lab/Tubes/Tube07: /World/Lab/Rack/B3
      /World/Lab/Tubes/Tube08: /World/Lab/Rack/B4
    locations: locations.yaml
  template: labware/synthetic-tube-reference@1
