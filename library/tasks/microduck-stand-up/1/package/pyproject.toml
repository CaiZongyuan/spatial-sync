[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lw-microduck-stand-up"
version = "0.1.0"
requires-python = ">=3.11"

[project.entry-points."mjlab.tasks"]
lw_microduck_stand_up = "lw_microduck_stand_up:register"

[tool.setuptools.packages.find]
include = ["lw_microduck_stand_up*"]
