schema: lw.scene-plan/1
recipe: sf3-blender-factory-v2
buildLabel: second-scene-reuse
units:
  length: m
  upAxis: Z
  metersPerUnit: 1
scene:
  name: tube-rack-reuse
  title: Second scene reusing the repaired rack
  description: >-
    A second scene pins the already imported six-hole rack version 2 and the same
    procedural tube. It contains no robot and no copied asset bytes, proving the
    repaired static object is retrievable and reusable by a later scene.
  sources:
    - newton
  simulation:
    solver: xpbd
    warmupSteps: 1
  locations:
    locations: {}
procedural:
  - id: environment/six-hole-tube-rack
    version: 2
    kind: environment
    type: six-hole-tube-rack
    seed: 151
    license: CC0-1.0
    rack:
      widthM: 0.13
      depthM: 0.09
      heightM: 0.042
      wallThicknessM: 0.006
      baseThicknessM: 0.006
      plateThicknessM: 0.008
      holeDiameterM: 0.020
      tubeDiameterM: 0.016
      clearanceM: 0.002
      pitchXM: 0.035
      pitchYM: 0.035
      rows: 2
      columns: 3
      collision: holes
      massDensityKgM3: 700.0
  - id: labware/sf3-test-tube
    version: 1
    kind: labware
    type: test-tube
    seed: 151
    license: CC0-1.0
    tube:
      diameterM: 0.016
      heightM: 0.030
      massDensityKgM3: 1200.0
instances:
  - instanceId: rack
    entityKey: /World/Lab/Rack
    asset: environment/six-hole-tube-rack@2
    transform:
      positionM: [0.0, 0.0, 0.75]
      rotationDeg: [0.0, 0.0, 0.0]
  - instanceId: tube
    entityKey: /World/Lab/Tubes/Tube01
    asset: labware/sf3-test-tube@1
    transform:
      positionM: [-0.035, -0.0175, 0.756]
      rotationDeg: [0.0, 0.0, 0.0]
    seat:
      rack: rack
      hole: A1
    binding:
      template: labware/sf3-test-tube@1
      config:
        robots: []
        locationSites:
          - /World/Lab/Rack/HoleA1
          - /World/Lab/Rack/HoleA2
          - /World/Lab/Rack/HoleA3
          - /World/Lab/Rack/HoleB1
          - /World/Lab/Rack/HoleB2
          - /World/Lab/Rack/HoleB3
