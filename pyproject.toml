[project]
name = "newton-spatial-sync"
version = "0.1.0"
description = "Newton spatial transforms over a source-independent web protocol"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic==2.12.4",
  "orjson>=3.10,<4",
  "numpy>=2.2,<3",
  "trimesh>=4.6,<5",
  "pyyaml>=6,<7",
  "httpx>=0.28,<1",
  "pillow>=12.3,<13",
  "sniffio==1.3.1", # Keep httpcore's per-operation async detection on the cached import path.
  "mcp==2.3.0",
  "psutil>=7.2,<8",
  "usd-core==26.8",
  "paho-mqtt==2.1.0",
  "onnx==1.19.1",
  "onnxruntime==1.23.2", # CPU distribution; policy inference never registers CUDA providers.
]

[project.scripts]
lw = "lw.__main__:main"

[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lw", "packages.vault", "packages.catalog_metadata"]

[tool.setuptools.package-dir]
lw = "apps/cli/lw"
"packages.vault" = "packages/vault"

[tool.setuptools.package-data]
"packages.catalog_metadata" = ["requirements.txt"]

[tool.setuptools.data-files]
