[project]
name = "newton-spatial-sync"
version = "0.1.0"
description = "Newton spatial transforms over a source-independent web protocol"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic==2.12.4",
  "orjson>=3.10,<4",
  "numpy>=2.2,<3",
  "trimesh>=4.6,<5",
  "pyyaml>=6,<7",
  "httpx>=0.28,<1",
  "mcp==2.3.0",
  "psutil>=7.2,<8",
  "usd-core==26.8",
  "paho-mqtt==2.1.0",
  "onnx==1.19.1",
  "onnxruntime==1.23.2", # CPU distribution; policy inference never registers CUDA providers.
]

[project.scripts]
lw = "lw.__main__:main"

[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lw", "packages.vault"]

[tool.setuptools.package-dir]
lw = "apps/cli/lw"
"packages.vault" = "packages/vault"

[tool.setuptools.data-files]
"share/spatial-sync/skills/lab" = ["skills/lab/SKILL.md"]
"share/spatial-sync/skills/lab-operate" = ["skills/lab-operate/SKILL.md"]
"share/spatial-sync/skills/lab-library" = ["skills/lab-library/SKILL.md"]
"share/spatial-sync/skills/lab-training-plan" = ["skills/lab-training-plan/SKILL.md"]
"share/spatial-sync/skills/lab-runtime-records" = ["skills/lab-runtime-records/SKILL.md"]
"share/spatial-sync/skills/lab-agent-evaluate" = ["skills/lab-agent-evaluate/SKILL.md"]
"share/spatial-sync/skills/archive/lab/5fea203445c6aeee93b5cdfe8cb00f49a3488cdb03f3c4b03f2c2c4ac3ba540d" = ["skills/archive/lab/5fea203445c6aeee93b5cdfe8cb00f49a3488cdb03f3c4b03f2c2c4ac3ba540d/SKILL.md"]

[project.optional-dependencies]
simulation = ["newton[sim]==1.7.0", "warp-lang==1.18.0", "viser==1.1.1", "pycollada==0.9.3", "scipy>=1.15,<2"]
usd = ["newton-usd-schemas>=0.5,<1"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["newton: optional integration tests requiring the simulation extra", "gpu: optional CUDA integration tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"] # Direct scripts add the repository root before local imports.
"factory/verify.py" = ["E402"] # Direct script adds the repository root before local imports.
"tests/sim_runtime/*.py" = ["E402"] # Optional Newton is skipped before importing its consumers.
