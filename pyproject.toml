[project.optional-dependencies]
simulation = ["newton[sim]==1.7.0", "warp-lang==1.18.0", "viser==1.1.1", "pycollada==0.9.3", "scipy>=1.15,<2"]
usd = ["newton-usd-schemas>=0.5,<1"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["newton: optional integration tests requiring the simulation extra", "gpu: optional CUDA integration tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"] # Direct scripts add the repository root before local imports.
"factory/verify.py" = ["E402"] # Direct script adds the repository root before local imports.
"tests/sim_runtime/*.py" = ["E402"] # Optional Newton is skipped before importing its consumers.
