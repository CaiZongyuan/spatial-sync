<svg xmlns="http://www.w3.org/2000/svg" width="640" height="782" viewBox="0 0 640 782" role="img" aria-labelledby="title desc"><title id="title">通过身体行动与完成物理任务</title><desc id="desc">具身智能和 Physical AI 的侧重点有区别，也有很大重叠；示例不表示严格的学科集合边界。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4d539d" stroke-width="1.5"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2b7666" stroke-width="1.5"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a9652e" stroke-width="1.5"/></marker></defs><rect width="640" height="782" rx="22" fill="#f4f1e9"/><g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif"><text x="32" y="68" font-size="32" font-weight="600" fill="#252421" text-anchor="start">具身智能与 Physical AI</text><rect x="56" y="110" width="560" height="150" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="56" y="110" width="6" height="150" rx="3" fill="#4d539d"/><text x="84" y="156" font-size="31" font-weight="600" fill="#4d539d" text-anchor="start">具身智能：通过身体行动</text><text x="84" y="201" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">例子：机械臂怎样把试管拿稳？</text><text x="84" y="238" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">关注身体怎样感知和操作环境。</text><rect x="56" y="290" width="560" height="150" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="56" y="290" width="6" height="150" rx="3" fill="#a9652e"/><text x="84" y="336" font-size="31" font-weight="600" fill="#a9652e" text-anchor="start">Physical AI：把物理任务做成</text><text x="84" y="381" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">例子：机器人和仪器怎样配合，</text><text x="84" y="418" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">完成一批样品的处理？</text><path d="M 336 445 V 485" fill="none" stroke="#2b7666" stroke-width="3" marker-end="url(#teal)"/><rect x="56" y="495" width="560" height="150" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="56" y="495" width="6" height="150" rx="3" fill="#2b7666"/><text x="84" y="541" font-size="31" font-weight="600" fill="#2b7666" text-anchor="start">两者有很大的重叠</text><text x="84" y="586" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">真实环境中的智能机器人，</text><text x="84" y="623" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">通常同时涉及两者。</text><text x="32" y="702" font-size="25" font-weight="400" fill="#625e57" text-anchor="start">具身智能的身体也可以在仿真中。</text><text x="32" y="743" font-size="25" font-weight="400" fill="#625e57" text-anchor="start">Physical AI 也可以通过固定设备工作。</text></g></svg>