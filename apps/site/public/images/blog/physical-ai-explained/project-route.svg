<svg xmlns="http://www.w3.org/2000/svg" width="640" height="880" viewBox="0 0 640 880" role="img" aria-labelledby="title desc"><title id="title">Lab World 的实验环境路线</title><desc id="desc">从仿真环境起步，让 AI 尝试操作、检查结果并反复比较改进，再验证向真实设备的迁移。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4d539d" stroke-width="1.5"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2b7666" stroke-width="1.5"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a9652e" stroke-width="1.5"/></marker></defs><rect width="640" height="880" rx="22" fill="#f4f1e9"/><g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif"><text x="32" y="68" font-size="32" font-weight="600" fill="#252421" text-anchor="start">Lab World 在搭建什么</text><rect x="88" y="110" width="528" height="122" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="88" y="110" width="6" height="122" rx="3" fill="#4d539d"/><text x="116" y="156" font-size="31" font-weight="600" fill="#4d539d" text-anchor="start">准备一间实验室</text><text x="116" y="201" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">先在仿真里搭好设备和场景。</text><path d="M 352 236 V 260" fill="none" stroke="#4d539d" stroke-width="3" marker-end="url(#blue)"/><rect x="88" y="270" width="528" height="122" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="88" y="270" width="6" height="122" rx="3" fill="#a9652e"/><text x="116" y="316" font-size="31" font-weight="600" fill="#a9652e" text-anchor="start">让 AI 尝试操作</text><text x="116" y="361" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">读取现场状态，发出设备操作。</text><path d="M 352 396 V 420" fill="none" stroke="#4d539d" stroke-width="3" marker-end="url(#blue)"/><rect x="88" y="430" width="528" height="122" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="88" y="430" width="6" height="122" rx="3" fill="#2b7666"/><text x="116" y="476" font-size="31" font-weight="600" fill="#2b7666" text-anchor="start">看清有没有做成</text><text x="116" y="521" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">检查结果，保存成功与失败记录。</text><path d="M 352 556 V 580" fill="none" stroke="#4d539d" stroke-width="3" marker-end="url(#blue)"/><rect x="88" y="590" width="528" height="122" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="88" y="590" width="6" height="122" rx="3" fill="#4d539d"/><text x="116" y="636" font-size="31" font-weight="600" fill="#4d539d" text-anchor="start">反复练习和比较</text><text x="116" y="681" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">尝试改进，验证是否真的变好。</text><path d="M 84 652 H 42 V 171 H 78" fill="none" stroke="#2b7666" stroke-width="3" marker-end="url(#teal)"/><text x="32" y="798" font-size="25" font-weight="400" fill="#625e57" text-anchor="start">三维界面帮助人观察这个过程。</text><text x="32" y="839" font-size="25" font-weight="400" fill="#625e57" text-anchor="start">仿真里的能力，仍需在真实设备上验证。</text></g></svg>