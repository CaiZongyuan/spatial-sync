<svg xmlns="http://www.w3.org/2000/svg" width="640" height="705" viewBox="0 0 640 705" role="img" aria-labelledby="title desc"><title id="title">信息管理、数字孪生与 Physical AI 的工作重点</title><desc id="desc">三类能力分别强调组织信息、数字表示与分析，以及利用现场信息选择并执行物理行动。它们可以结合。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4d539d" stroke-width="1.5"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2b7666" stroke-width="1.5"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a9652e" stroke-width="1.5"/></marker></defs><rect width="640" height="705" rx="22" fill="#f4f1e9"/><g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif"><text x="32" y="68" font-size="32" font-weight="600" fill="#252421" text-anchor="start">同一间实验室，三种工作重点</text><rect x="56" y="110" width="560" height="150" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="56" y="110" width="6" height="150" rx="3" fill="#4d539d"/><text x="84" y="156" font-size="31" font-weight="600" fill="#4d539d" text-anchor="start">信息管理系统</text><text x="84" y="201" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">有哪些样品？谁预约了设备？</text><text x="84" y="238" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">把信息记录和组织好。</text><rect x="56" y="284" width="560" height="150" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="56" y="284" width="6" height="150" rx="3" fill="#2b7666"/><text x="84" y="330" font-size="31" font-weight="600" fill="#2b7666" text-anchor="start">数字孪生</text><text x="84" y="375" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">现场现在怎样？接下来会怎样？</text><text x="84" y="412" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">用数字版本帮助观察与分析。</text><rect x="56" y="458" width="560" height="150" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="56" y="458" width="6" height="150" rx="3" fill="#a9652e"/><text x="84" y="504" font-size="31" font-weight="600" fill="#a9652e" text-anchor="start">Physical AI</text><text x="84" y="549" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">接下来怎么做？做成了吗？</text><text x="84" y="586" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">利用现场信息，操作并检查结果。</text><text x="32" y="666" font-size="25" font-weight="400" fill="#625e57" text-anchor="start">这些能力可以在同一套软件里结合。</text></g></svg>