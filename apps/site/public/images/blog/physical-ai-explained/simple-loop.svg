<svg xmlns="http://www.w3.org/2000/svg" width="640" height="838" viewBox="0 0 640 838" role="img" aria-labelledby="title desc"><title id="title">看现场、决定、执行与检查结果</title><desc id="desc">系统利用现场信息决定操作，让机器人或设备执行，并根据实际结果调整下一步。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4d539d" stroke-width="1.5"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2b7666" stroke-width="1.5"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a9652e" stroke-width="1.5"/></marker></defs><rect width="640" height="838" rx="22" fill="#f4f1e9"/><g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif"><text x="32" y="68" font-size="32" font-weight="600" fill="#252421" text-anchor="start">一次操作，怎样才算做完</text><rect x="88" y="110" width="528" height="122" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="88" y="110" width="6" height="122" rx="3" fill="#4d539d"/><text x="116" y="156" font-size="31" font-weight="600" fill="#4d539d" text-anchor="start">看现场</text><text x="116" y="201" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">样品在哪里？设备能不能用？</text><path d="M 352 236 V 260" fill="none" stroke="#4d539d" stroke-width="3" marker-end="url(#blue)"/><rect x="88" y="270" width="528" height="122" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="88" y="270" width="6" height="122" rx="3" fill="#4d539d"/><text x="116" y="316" font-size="31" font-weight="600" fill="#4d539d" text-anchor="start">决定下一步</text><text x="116" y="361" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">先做什么？现在需要等待吗？</text><path d="M 352 396 V 420" fill="none" stroke="#4d539d" stroke-width="3" marker-end="url(#blue)"/><rect x="88" y="430" width="528" height="122" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="88" y="430" width="6" height="122" rx="3" fill="#a9652e"/><text x="116" y="476" font-size="31" font-weight="600" fill="#a9652e" text-anchor="start">让机器人和设备执行</text><text x="116" y="521" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">拿起试管、移动、放入设备。</text><path d="M 352 556 V 580" fill="none" stroke="#4d539d" stroke-width="3" marker-end="url(#blue)"/><rect x="88" y="590" width="528" height="122" rx="16" fill="#fffefa" stroke="#d8d2c7" stroke-width="2"/><rect x="88" y="590" width="6" height="122" rx="3" fill="#2b7666"/><text x="116" y="636" font-size="31" font-weight="600" fill="#2b7666" text-anchor="start">检查实际结果</text><text x="116" y="681" font-size="26" font-weight="400" fill="#625e57" text-anchor="start">真的放好了吗？要不要调整？</text><path d="M 84 652 H 42 V 171 H 78" fill="none" stroke="#2b7666" stroke-width="3" marker-end="url(#teal)"/><text x="32" y="798" font-size="25" font-weight="400" fill="#625e57" text-anchor="start">没有达到目标，就带着新情况继续判断。</text></g></svg>