 if(k==='budget'){say('用户','给实验台旁边找一辆合适的移动台车。');if(i>=1)say('agent','找到的大型移动台车为 521.2 MiB，超过当前单包 512 MiB 上限，平台未执行获取。另有 163.1 MiB 的工具台车符合需求。');if(i>=2){say('用户','用较小的那一个，保留原预算。');say('agent','我会通过平台获取这个候选，再用于后续场景。');}}

function chatSurface(s){return surfaceFrame('Claude Code','需求、参考与修改都在这里沟通',`<div class="external-chat"><aside class="chat-project"><span class="eyebrow">EXTERNAL CONVERSATION</span><h2>试管转运实验室</h2><p>这是外部 agent 对话的演示摘录，不是 Lab World 内置聊天。</p><div class="rule"></div><div class="statuslist"><span>参考图片与资料</span><span>用途、尺寸与型号</span><span>布局确认与修改指令</span></div><div class="note">确认后，Agent 调用平台工具检索素材，调用 Blender MCP 制作场景。</div></aside><div class="chat-transcript">${bubbles(s)}<div class="chat-end">对话输入在真实 Claude Code 中进行。使用上方原型播放器查看下一段协作。</div></div></div>`,'chat-window');}

function searchResults(s){let q=ui.query.toLowerCase();let term=/推车|台车|cart|trolley/.test(q)?'cart':/机械臂|机器人|fr3|robot/.test(q)?'robot':/工作台|桌|table|desk/.test(q)?'table':q;const relevant=ASSETS.filter(a=>(ui.scope==='all'||(ui.scope==='local'?s.installed.has(a.id):!s.installed.has(a.id)))&&(!term||(a.name+' '+a.en+' '+a.version).toLowerCase().includes(term)));const strict=[],near=[];for(const a of relevant){const gaps=[];if(!a.admitted)gaps.push('许可未准入');if(ui.maxWidth&&(a.width===null||a.width>Number(ui.maxWidth)/100))gaps.push(a.width===null?'尺寸未知':'尺寸超出条件');if(ui.physical&&a.collision!==true)gaps.push('碰撞未验证');(gaps.length?near:strict).push({...a,gaps});}return {strict,near};}
function assetCard(a,s,near=false){return `<article class="asset-card"><button class="asset-art" data-action="detail" data-id="${a.id}" aria-label="查看 ${a.name}">${assetIllustration(a.kind)}</button><div class="asset-info"><div class="row between"><h3>${a.name}</h3><span class="tag ${s.installed.has(a.id)?'green':'blue'}">${s.installed.has(a.id)?'本地':'在线'}</span></div><p class="desc">${near?esc(a.gaps.join(' · ')):a.why}</p><div class="row between tiny"><span>${a.width===null?'尺寸未知':Math.round(a.width*100)+' cm 宽'}</span><span>${a.bytes?a.bytes+' MiB':'已有固定版本'}</span></div><div class="asset-id">${a.version}</div><div class="row between" style="margin-top:12px"><span class="tiny muted">${a.license}</span>${btn(s.installed.has(a.id)?'查看详情':'获取到本地库',s.installed.has(a.id)?'detail':'acquire',`data-id="${a.id}"`,'small')}</div></div></article>`;}
function assetPage(s){const r=searchResults(s);return `<section class="panel"><div class="panelhead"><div><span class="eyebrow">ASSET LIBRARY</span><h3 style="margin-top:4px">人和 Agent 使用同一个目录</h3></div><span class="tag">原型中的固定示例数据</span></div><div class="pad"><form id="searchForm" class="searchbar"><input id="searchQuery" value="${esc(ui.query)}" placeholder="检索素材：如实验台旁的小推车" aria-label="检索素材"><button class="primary" type="submit">${icon('search')} 检索</button></form><div class="filters"><label>范围<select data-ui="scope"><option value="all" ${ui.scope==='all'?'selected':''}>本地与在线</option><option value="local" ${ui.scope==='local'?'selected':''}>仅本地</option><option value="online" ${ui.scope==='online'?'selected':''}>仅在线</option></select></label><label>宽度上限 · cm<input type="number" data-ui="maxWidth" min="1" value="${ui.maxWidth}" placeholder="不限"></label><div style="padding-top:20px"><label class="checkline"><input type="checkbox" data-ui="physical" ${ui.physical?'checked':''}>静态碰撞已验证</label></div></div><div class="note">这里可以检索、筛选和获取素材。它不修改任何场景布局。<br><span class="tiny">尺寸、准入和验证为原型示例值，语义检索用有限关键词模拟。</span></div><div class="result-meta"><span>${r.strict.length} 个符合条件 · ${r.near.length} 个待核实 / 不满足</span><label class="checkline"><input type="checkbox" data-ui="near" ${ui.near?'checked':''}>另列近似候选</label></div><div class="asset-grid">${r.strict.length?r.strict.map(a=>assetCard(a,s)).join(''):'<div class="empty full">没有符合所有条件的候选。未知属性没有被当作通过。</div>'}</div>${ui.near&&r.near.length?`<h3 style="margin:24px 0 12px">未满足条件的候选</h3><div class="asset-grid">${r.near.map(a=>assetCard(a,s,true)).join('')}</div>`:''}<p class="tiny muted" style="margin-top:20px">素材选型和场景搭配由原对话中的 Agent 完成；人工检索仍可独立使用。</p></div></section>`;}
function reportPage(s){const v=currentVersion(s);if(!v)return `<section class="panel empty"><h2>尚无场景验证报告</h2><p>导入场景包后，平台才能对对应版本运行检查。</p></section>`;const pending=v.result==='pending',failed=v.result==='failed';return `<section class="panel"><div class="panelhead"><h3>验证报告 · lab-cell@${v.id}</h3><span class="tag ${failed?'amber':pending?'':'green'}">${statusLabel(v.result)}</span></div><div class="pad stack"><table class="check-table"><thead><tr><th>层次</th><th>检查内容</th><th>结果</th></tr></thead><tbody>${[['视觉','比例、材质与平台显示',pending?'未运行':'通过'],['结构','固定引用、单位、设备绑定',pending?'未运行':'通过'],['物理','试管架孔洞、接触与碰撞',pending?'未运行':failed?'失败':'通过'],['任务','本次场景中的试管放置',pending?'未运行':failed?'被阻断':'通过']].map(([a,b,c])=>`<tr><td>${a}</td><td>${b}</td><td class="${c==='通过'?'ok':c==='失败'?'bad':'warn'}">${c}</td></tr>`).join('')}</tbody></table>${failed?`<div class="note error"><strong>试管架碰撞体封住孔洞</strong><p class="smalltext">将这份问题摘要交给原对话中的 Agent。修正发生在 Blender，随后导入新版本；平台不会在这里修改孔径或几何。</p></div>`:`<div class="note">${pending?'这是新版本，不能沿用旧布局的任务验证结论。':'本次模拟结果已齐全，可启动当前版本。'}<br><span class="tiny">所有报告均为原型示例，没有运行 Newton。</span></div>`}<div class="row">${btn('复制问题 / 报告摘要','copyReport')}${btn('查看对应场景','page','data-value="scene"')}${btn('重新验证当前版本','validate','','primary')}</div></div></section>`;}
function platformSurface(s){const nav=[['scene','场景','layers'],['assets','素材库','search'],['validation','验证','check'],['versions','版本','file'],['activity','执行记录','clock']];const title={scene:'场景与验证结果',assets:'素材库',validation:'验证报告',versions:'已接收的场景版本',activity:'平台可见的执行记录'};const body=ui.page==='assets'?assetPage(s):ui.page==='validation'?reportPage(s):ui.page==='versions'?`<div class="artifact-layout">${versionList(s)}<div class="stack">${dependencyList(s)}${briefReadOnly(s)}</div></div>`:ui.page==='activity'?activity(s):platformScene(s);return surfaceFrame('Lab World','资产与场景管理 · 检索 · 验证 · 运行',`<div class="platform-frame"><nav class="platform-nav"><div class="brand">${icon('cube')}<span>Lab World</span></div><span class="eyebrow">WORKSPACE</span>${nav.map(([id,label,ic])=>btn(icon(ic)+'<span>'+label+'</span>','page',`data-value="${id}" aria-label="${label}"`,ui.page===id?'selected':'')).join('')}<div class="nav-footer">外部制作，版本导入<br>当前仅为交互原型</div></nav><main class="platform-main"><div class="platform-heading"><div><div class="eyebrow">LOCAL LABORATORY</div><h1>${title[ui.page]}</h1><p>只读查看已接收的信息，管理素材与场景的实际版本。</p></div><span class="tag ${currentVersion(s)?.result==='passed'?'green':''}">${s.versions.length?'最近收到 v'+s.versions.at(-1).id:'等待场景导入'}</span></div>${body}</main></div>`,'lab-window');}
function player(){const steps=STORIES[ui.story],step=steps[ui.frame];return `<header class="prototype-header"><div><span class="eyebrow">COLLABORATION, ACROSS TOOLS</span><h1>对话里确认，Blender 里制作，平台里验证。</h1><p>这是三个独立界面的协作原型。播放器推进的是模拟事件，不是产品里的制作按钮。</p></div>${btn('查看分工与规划','roadmap','','small')}</header><section class="prototype-player"><div class="player-controls"><span class="player-badge">原型播放器 · 非产品功能</span><select id="story" aria-label="演示情景">${[['build','从需求到场景交付'],['revision','修改一个已交付场景'],['budget','素材下载超过预算'],['robot','缺少可信机器人']].map(([id,t])=>`<option value="${id}" ${ui.story===id?'selected':''}>${t}</option>`).join('')}</select>${ui.story==='revision'?`<select data-ui="method" aria-label="修改方式"><option value="agent" ${ui.method==='agent'?'selected':''}>通过 Agent 修改</option><option value="manual" ${ui.method==='manual'?'selected':''}>在 Blender 人工修改</option></select>`:''}<span class="spacer"></span>${btn('上一段','previous',ui.frame===0?'disabled':'','small')}${btn(ui.frame===steps.length-1?'已到本情景结尾':'演示下一段 →','next',ui.frame===steps.length-1?'disabled':'','primary small')}${btn('查看交付后的平台','completed','','small')}${btn('重置','reset','','small')}</div><div class="player-caption"><span class="mono">${String(ui.frame+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}</span><strong>${step[1]}</strong><span>${step[2]}</span></div></section><nav class="surface-tabs" aria-label="观察哪个独立应用">${[['chat','Claude Code','需求 · 图片 · 确认 · 修改'],['blender','Blender','Agent 或人工编辑工作文件'],['platform','Lab World','检索 · 管理 · 验证 · 运行']].map(([id,t,desc],i)=>`${i?'<span class="surface-arrow">↔</span>':''}<button data-action="surface" data-value="${id}" class="${ui.surface===id?'active':''}"><span class="surface-number">0${i+1}</span><div><strong>${t}</strong><small>${desc}</small></div><span class="surface-open">${ui.surface===id?'正在查看':'查看'}</span></button>`).join('')}</nav>`;}
function render(){const s=snapshot();document.body.className='boundary-v2';document.documentElement.dataset.theme=ui.theme;document.getElementById('app').innerHTML=`<div class="prototype-shell">${player()}${ui.surface==='chat'?chatSurface(s):ui.surface==='blender'?blenderSurface(s):platformSurface(s)}<footer class="prototype-foot"><span>内存演示 · 数据与结果均为模拟 · 不连接 Claude Code、Blender 或平台服务</span>${btn('查看演示状态','state','','quiet small')}</footer></div><div class="switcher"><span class="legend">平台结果布局</span>${['A','B','C'].map((v,i)=>btn(v+' '+['场景优先','资产与版本','接收记录'][i],'variant',`data-value="${v}"`,ui.variant===v?'active':'')).join('')}<span class="sep"></span>${btn('分工说明','roadmap')}</div>`;}
function notify(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('visible'),5000);}
function setFrame(i,reset=false){const oldFrame=ui.frame;ui.frame=Math.max(0,Math.min(STORIES[ui.story].length-1,i));ui.surface=ui.story==='revision'&&ui.method==='manual'&&ui.frame===0?'blender':STORIES[ui.story][ui.frame][0];ui.page=ui.surface==='platform'&&((ui.story==='build'&&ui.frame===2)||ui.story==='budget'||ui.story==='robot')?'assets':ui.story==='build'&&ui.frame===7?'validation':'scene';ui.version=null;if(reset||ui.frame<oldFrame)local={downloads:[],reports:{},running:null,activity:[]};if(ui.page==='assets'){ui.query=ui.story==='robot'?'未收录型号':'小推车';ui.maxWidth=ui.story==='robot'?'':'60';ui.physical=ui.story!=='robot';}clearTimeout(window.toastTimer);document.getElementById('toast').classList.remove('visible');render();window.scrollTo(0,0);}
function versionAction(type){const s=snapshot(),v=currentVersion(s);if(!v){notify('平台尚未收到场景版本。');return;}if(type==='launch'){if(v.result!=='passed'){notify('当前版本尚未通过验证，不能启动。可以查看报告并交给外部 Agent 处理。');return;}if(local.running&&local.running!==v.id){notify(`演示会话已使用 v${local.running}。请先选中该版本并停止会话，再启动另一版本。`);return;}local.running=local.running===v.id?null:v.id;render();notify(local.running?'模拟会话已启动；没有实际运行物理引擎。':'模拟会话已停止。');}else{local.reports[v.id]=v.id===1?'failed':'passed';local.activity.push(['现在','平台验证',`lab-cell@${v.id} 重新验证：${v.id===1?'碰撞仍失败，外部几何需要修正':'模拟通过'}`,'验证结果']);render();notify('只重新检查当前版本；没有编辑任何几何或布局。');}}
async function copyText(text){try{await navigator.clipboard.writeText(text);notify('摘要已复制。请粘贴到原 Agent 对话；平台没有自动发送消息。');}catch{openDrawer('copy',text);}}
function openDrawer(type,id){ui.drawer=type;const s=snapshot(),v=currentVersion(s);let html='';if(type==='roadmap'){html=`<span class="eyebrow">WORKFLOW OWNERSHIP</span><h2>三个界面，各自负责一件事</h2><div class="roadmap-row"><span class="roadnum">01</span><div><h3>Claude Code 等外部 Agent</h3><p>用户发图片、说用途、补尺寸、确认布局并提出修改。Agent 用平台工具查素材，用 Blender MCP 建模。平台不复制一套访谈或聊天界面。</p></div></div><div class="roadmap-row"><span class="roadnum">02</span><div><h3>Blender 与外部工厂</h3><p>Agent 可以脚本建模，用户也可以直接编辑 .blend。保留可信机器人数据，提取布局，导出新素材与场景包。</p></div></div><div class="roadmap-row"><span class="roadnum">03</span><div><h3>Lab World</h3><p>人和 Agent 都能检索与获取素材；平台接收版本、展示来源与缺口、验证并运行。它只知道明确提交给它的信息。</p></div></div><div class="rule"></div><h3>交付顺序</h3>${[['检索与获取','双语元数据、明确条件、许可与预算、固定版本。'],['场景工厂与 Blender 桥接','实例映射、参数化补制、固定 USD 引用、导出与导入。'],['外部 Agent 的场景构建 skill','指导外部对话与制作，不新增平台建模表单。'],['平台结果管理与验收','已接收的摘要、资产依赖、版本、验证、运行与失败回传。']].map(([a,b],i)=>`<div class="roadmap-row"><span class="roadnum">${i+1}</span><div><h3>${a}</h3><p>${b}</p><span class="tag">计划中的能力</span></div></div>`).join('')}<div class="note">此原型的“演示下一段”属于播放器。真实使用时，进度由外部工具执行和提交推动，用户无需在平台逐步点击。</div>`;}else if(type==='state'){html=`<h2>演示中的两份状态</h2><h3>外部制作工作区</h3><pre>${esc(JSON.stringify({briefInChat:s.brief,graybox:s.gray,rackMade:s.rack,cartOffset:s.offset},null,2))}</pre><h3>平台已经收到</h3><pre>${esc(JSON.stringify({versions:s.versions,receivedBrief:s.submittedBrief,lastReceived:s.lastReceived,records:s.records},null,2))}</pre><p>上面的外部状态仅由原型播放器知道，不属于平台实时可见数据。</p>`;}else if(type==='copy'){html=`<h2>报告摘要</h2><p>复制下面内容，粘贴给原对话中的 Agent。</p><pre tabindex="0">${esc(id)}</pre>`;}else{const a=byId(id);html=`<span class="eyebrow">ASSET METADATA / 模拟数据</span><h2>${a.name}</h2><div class="thumb-large">${assetIllustration(a.kind)}</div><p>${a.why}</p><div class="rule"></div><dl class="properties"><dt>来源</dt><dd>${a.origin}</dd><dt>标识</dt><dd class="mono">${a.version}</dd><dt>许可</dt><dd>${a.license}</dd><dt>宽度</dt><dd>${a.width===null?'未知':a.width+' m'}</dd><dt>源文件大小</dt><dd>${a.bytes?a.bytes+' MiB':'本地版本'}</dd><dt>获取上限</dt><dd>512 MiB / 包</dd></dl><div class="rule"></div><div class="row">${btn('复制素材引用','copyAsset',`data-id="${a.id}"`)}${s.installed.has(a.id)?'<span class="tag green">已在本地</span>':btn('获取到本地库','acquire',`data-id="${a.id}"`,'primary')}</div><p class="tiny" style="margin-top:14px">尺寸、准入与验证状态均为演示值。此处没有“摆放到场景”或模型编辑操作。</p>`;}document.getElementById('modal').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="详情与规划">${btn('✕','close','aria-label="关闭"','close quiet')}${html}</section></div>`;document.querySelector('.drawer .close').focus();}
function handle(type,el){const value=el.dataset.value,id=el.dataset.id;switch(type){case 'surface':ui.surface=value;render();break;case 'page':ui.page=value;ui.surface='platform';render();break;case 'view':ui.view=value;render();break;case 'variant':ui.variant=value;ui.surface='platform';{const url=new URL(location.href);url.searchParams.set('variant',value);try{history.replaceState(null,'',url);}catch{}}render();window.scrollTo(0,0);break;case 'next':setFrame(ui.frame+1);break;case 'previous':setFrame(ui.frame-1);break;case 'reset':setFrame(0,true);break;case 'completed':ui.story='build';setFrame(9,true);break;case 'version':ui.version=Number(id);render();break;case 'acquire':{const a=byId(id),s=snapshot();if(s.installed.has(id)){notify('相同素材已在本地，复用现有版本。');break;}if(ui.offline){notify('当前模拟离线，不能新增获取。');break;}if(!a.admitted){notify('许可或来源尚未准入，保持未知，不执行获取。');break;}if(a.bytes>512){notify('超过单包 512 MiB。请把原因带回原对话选择替代方案；Agent 不能自行提高上限。');break;}local.downloads.push(id);local.activity.push(['现在','用户 / 素材库',`获取 ${a.name} ${a.bytes} MiB 到本地库`,'模拟获取']);render();if(ui.drawer==='detail')openDrawer('detail',id);notify('模拟获取完成。素材已入库，没有编辑场景。');break;}case 'launch':case 'validate':versionAction(type);break;case 'copyReport':{const s=snapshot(),v=currentVersion(s);copyText(v?`Lab World 报告（原型模拟）\n版本 lab-cell@${v.id}\n结果：${statusLabel(v.result)}\n${v.result==='failed'?'试管架碰撞体封住孔洞。请在外部工厂修正并导入新版本，保留旧版本。':'请查看对应版本的检查结果。'}`:'尚无场景验证报告');break;}case 'copyAsset':copyText(byId(id).version);break;case 'roadmap':case 'state':case 'detail':openDrawer(type,id);break;case 'close':ui.drawer=null;document.getElementById('modal').innerHTML='';break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){handle(el.dataset.action,el);return;}if(e.target.classList.contains('overlay')){ui.drawer=null;document.getElementById('modal').innerHTML='';}});
document.addEventListener('submit',e=>{if(e.target.id==='searchForm'){e.preventDefault();ui.query=document.getElementById('searchQuery').value;render();}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='story'){ui.story=el.value;setFrame(0,true);return;}if(el.dataset.ui){ui[el.dataset.ui]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.ui==='method'){setFrame(ui.frame);return;}render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){ui.drawer=null;document.getElementById('modal').innerHTML='';return;}if(e.target.closest('input,textarea,select,[contenteditable]')||ui.drawer)return;if(ui.surface==='platform'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();const variants=['A','B','C'];handle('variant',{dataset:{value:variants[(variants.indexOf(ui.variant)+(e.key==='ArrowRight'?1:2))%3]}});}});

/* Throwaway, deterministic SVG design illustration. No renderer, physics or network. */
function sceneIllustration(options = {}) {
  const n = (v, fallback, min, max) => Number.isFinite(Number(v)) ? Math.max(min, Math.min(max, Number(v))) : fallback;
  const width = n(options.roomWidth, 6, 2, 20), depth = n(options.roomDepth, 4, 2, 20);
  const detailed = !!options.detailed, rackReady = !!options.rackReady, collision = !!options.collision;
  const present = kind => !Array.isArray(options.presentAssets) || options.presentAssets.includes(kind);
  const robotTrusted = present('robot') && options.robotTrusted !== false;
  const ghost = kind => (kind === 'robot' ? !robotTrusted : !present(kind)) ? 'opacity=".28" stroke-dasharray="4 4"' : '';
  const robotLabel = robotTrusted ? '可信 FR3 素材' : '机器人 · 占位';
  const offset = n(options.cartOffset, 0, -1.3, 1.3);
  const requested = String(options.selected || '').toLowerCase();
  const selected = ['robot','rack','cart','table','cabinet'].find(k => requested.includes(k)) || (requested.includes('fr3') ? 'robot' : '');
  const c = {ink:'#494841', line:'#aaa99f', floor:'#eeeae2', wall:'#f8f6f0', shade:'#d3d1c7', paper:'#fffefa', indigo:'#646bce', pale:'#e3e5fa', blue:'#b8cbd3', muted:'#818078'};
  const title = options.view === 'top' ? '实验室俯视布局示意' : '实验室等距布局示意';
  const label = (x,y,t,anchor='start',fill=c.muted,size=12) => `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${fill}" font-size="${size}" font-family="Segoe UI,Microsoft YaHei,sans-serif">${t}</text>`;
  const line = (a,b,stroke=c.line,sw=1,extra='') => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${stroke}" stroke-width="${sw}" ${extra}/>`;
  const root = body => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-label="${title}" style="width:100%;height:100%;display:block"><title>${title}</title><desc>设计原型示意。包含工作台、${robotTrusted?'可信机器人示意':'机器人占位件'}、试管架、台车与示例布景柜体。未选素材以淡色占位；图形与尺寸仅用于理解流程，不代表实际物理仿真结果。</desc><g stroke-linejoin="round" stroke-linecap="round">${body}</g></svg>`;
  const tx = width*.22, ty = depth*.39, tw = width*.52, td = depth*.22;
  const cx = Math.max(width*.55,Math.min(width*.85,width*.77+offset)), cy = depth*.74;
  if (options.view === 'top') {
    const s = Math.min(88,610/width,360/depth), left = (900-width*s)/2, top = (560-depth*s)/2;
    const p = (x,y) => [left+x*s,top+y*s];
    const rect = (x,y,w,h,fill,stroke=c.line,extra='') => `<rect x="${p(x,y)[0]}" y="${p(x,y)[1]}" width="${w*s}" height="${h*s}" rx="3" fill="${fill}" stroke="${stroke}" ${extra}/>`;
