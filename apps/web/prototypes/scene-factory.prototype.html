function reduce(state,action){let s=structuredClone(state), note='';const invalidate=()=>{s.assembled=false;s.validation='pending';s.delivered=false;};
switch(action.type){
case 'stage':s.step=action.value;return s;
case 'brief':s.brief[action.key]=action.value;s.confirmed=false;s.layout=false;invalidate();note='需求变更：需要重新确认简报与布局。';break;
case 'reference':s.reference=action.value;note='参考图已在本地读取；仅保存在本次页面内存。';break;
case 'confirm':if(!(s.brief.width>=2&&s.brief.width<=20&&s.brief.depth>=2&&s.brief.depth<=20)){note='请提供 2–20 m 范围内的房间尺寸。';break;}s.confirmed=true;s.step=1;note='需求已确认。优先复用官方 FR3，检索台车，试管架单独补制。';break;
case 'toggle':s.catalogReviewed=false;s.selected=s.selected.includes(action.id)?s.selected.filter(x=>x!==action.id):[...s.selected,action.id];s.layout=false;invalidate();note='素材清单已更新，布局和后续验证需重新确认。';break;
case 'acquire':{if(!s.confirmed){note='请先确认需求简报。';break;}const pending=s.selected.map(byId).filter(a=>a.source==='online'&&!s.acquired.includes(a.id));if(!pending.length){note='当前选中素材都已在本地，无需重复获取。';break;}if(s.offline){note='当前为模拟断网状态：本地内容可复用，不能获取新的在线素材。';break;}const blocked=pending.find(a=>!a.admitted||a.bytes>512);if(blocked){note=blocked.bytes>512?`${blocked.name} 为 ${blocked.bytes} MiB，超过单包 512 MiB 上限。请换候选或交由用户调整策略。`:`${blocked.name} 的许可尚未准入。agent 保留缺口，不执行获取。`;break;}const sum=pending.reduce((v,a)=>v+a.bytes,0);if(sum>2048||s.download+sum>10240){note='此次选择超过批量或缓存预算。';break;}s.catalogReviewed=true;s.acquired.push(...pending.map(a=>a.id));s.download=+(s.download+sum).toFixed(1);note=`模拟获取完成：${pending.length} 个素材，${sum.toFixed(1)} MiB。已固定来源版本并保留许可。`;break;}
case 'nextLayout':if(!s.confirmed){note='先完成需求确认，再进入布局。';break;}s.catalogReviewed=true;s.step=2;note='灰盒保留缺失试管架的明确占位。';break;
case 'move':s.cartOffset=action.value;s.layout=false;invalidate();note='台车位置改变；原布局确认已失效。';break;
case 'layout':if(!s.confirmed){note='需求尚未确认。';break;}if(s.brief.robot!=='fr3'||!s.selected.includes('fr3')){note='缺少可信机器人资产。不能用照片自建外观模型替代所需型号。';break;}s.layout=true;s.step=3;note='灰盒布局已确认。agent 可以在这个范围内自主补齐素材。';break;
case 'rackParam':s[action.key]=action.value;s.rack='missing';invalidate();note='试管架参数改变，需要重新制作并验证。';break;
case 'build':if(s.rack==='ready'){note=`参数未变，复用试管架 @${s.rackRev}。`;break;}if(!s.layout){note='请先确认灰盒布局。';break;}if(!(s.hole>=12&&s.hole<=30&&s.pitch>=s.hole+4)){note='孔距至少比孔径大 4 mm，避免孔位相交。';break;}s.rack='ready';s.rackRev++;invalidate();note=`模拟补制完成：六孔试管架 @${s.rackRev}。几何参数已记录，任务用途仍待验证。`;break;
case 'compose':if(s.assembled){s.step=5;note=`场景内容未变，复用 lab-cell@${s.version}；已有验证结论保留。`;break;}if(!s.selected.includes('table')||!s.selected.some(id=>byId(id).kind==='cart')){note='本示例任务需要工作台与台车。请回素材清单补齐，或在正式产品中修订任务需求。';break;}if(!s.layout||s.rack!=='ready'||s.brief.robot!=='fr3'||!s.selected.includes('fr3')){note='尚缺已确认布局、可信机器人或已完成的试管架。';break;}if(s.selected.some(id=>byId(id).source==='online'&&!s.acquired.includes(id))){note='有选中素材尚未获取，请先回素材检索完成获取。';break;}s.version++;s.assembled=true;s.validation='pending';s.delivered=false;s.history.push({version:s.version,status:'待验证',rack:s.rackRev});s.step=5;note=`模拟生成 lab-cell@${s.version}。资产与布局固定引用，原始机器人未经过重建。`;break;
case 'validate':if(!s.assembled){note='请先生成场景版本。';break;}s.validation=s.scenario==='collision'&&!s.fixed?'failed':'passed';s.history[s.history.length-1].status=s.validation==='passed'?'模拟通过':'碰撞失败';note=s.validation==='passed'?'模拟验证通过：视觉、物理与本次任务分别有结果。':'视觉通过，物理失败：试管架碰撞体封住孔洞。交付已阻止。';break;
case 'fix':if(s.validation!=='failed'){note='当前没有待修正的碰撞失败。';break;}s.fixed=true;s.rackRev++;s.version++;s.history.push({version:s.version,status:'模拟通过',rack:s.rackRev});s.validation='passed';note=`模拟修正孔洞碰撞，生成试管架 @${s.rackRev} 与 lab-cell@${s.version} 并重验通过。旧失败版本保留。`;break;
case 'deliver':if(s.validation!=='passed'||!s.assembled){note='只有当前场景通过适用验证后，才能交付。可以先查看草稿。';break;}s.delivered=true;s.step=6;note=`模拟交付 lab-cell@${s.version}，六孔试管架可被其它场景复用。`;break;
case 'offline':s.offline=action.value;note=s.offline?'已模拟断网：本地场景仍可使用，新增获取将被阻止。':'已恢复模拟联网。';break;
case 'requestBudget':s.budgetRequest=true;note='已模拟提交预算调整请求；仍待用户决定，当前 512 MiB 上限不变。';break;
case 'robotRestore':s.brief.robot='fr3';if(!s.selected.includes('fr3'))s.selected.push('fr3');s.layout=false;invalidate();note='选择已有可信 FR3；请重新确认布局。';break;
case 'smaller':s.selected=s.selected.filter(id=>id!=='large'&&id!=='unknown');if(!s.selected.includes('cart'))s.selected.push('cart');s.layout=false;invalidate();note='已改选 163.1 MiB 的工具台车，可在当前预算内获取。';break;
}
if(note){s.last=note;s.logs=[note,...s.logs].slice(0,12);}return s;}

function matchAssets(assets,filters){const q=filters.q.toLowerCase().trim();let terms=q.split(/\s+/).filter(Boolean);if(/推车|台车|cart|trolley|搬运|放容器/.test(q))terms=['cart'];else if(/机械臂|机器人|fr3|robot/.test(q))terms=['robot'];else if(/桌|台面|工作台|desk|table/.test(q))terms=['table'];else if(/箱|box/.test(q))terms=['box'];else if(/柜|cabinet/.test(q))terms=['cabinet'];const relevant=assets.filter(a=>(filters.scope==='all'||a.source===filters.scope)&&(!terms.length||terms.some(t=>(a.name+' '+a.en+' '+a.version).toLowerCase().includes(t))));const strict=[],near=[];for(const a of relevant){const reasons=[];if(filters.width){if(a.width===null)reasons.push('宽度未知');else if(a.width>Number(filters.width)/100)reasons.push('宽度超出条件');}if(filters.collision&&a.collision!==true)reasons.push(a.collision===null?'碰撞未知':'仅布景');if(filters.license&&!a.admitted)reasons.push('许可未准入');(reasons.length?near:strict).push({...a,reasons});}return {strict,near};}

function actionbar(note,secondary=''){return `<div class="actionbar"><p>${note}</p><div class="row">${secondary}${primary()}</div></div>`;}
function briefContent(){return `<section class="panel"><div class="panelhead"><div><span class="eyebrow">SCENE BRIEF / 01</span><h3 style="margin-top:4px">试管转运实验室</h3></div><span class="tag ${state.confirmed?'green':'amber'}">${state.confirmed?'需求已确认':'等待需求确认'}</span></div><div class="stage-hero">${scene()}</div><div class="pad stack"><div class="fields"><label>场景用途<input data-brief="purpose" value="${esc(state.brief.purpose)}"></label><label>机器人型号<select data-brief="robot"><option value="fr3" ${state.brief.robot==='fr3'?'selected':''}>Franka FR3 · 本地可信资产</option><option value="unknown" ${state.brief.robot==='unknown'?'selected':''}>其它型号 · 暂无可信资产</option></select></label><label>房间宽度 · m<input type="number" min="2" max="20" step=".1" data-brief="width" value="${state.brief.width}"></label><label>房间进深 · m<input type="number" min="2" max="20" step=".1" data-brief="depth" value="${state.brief.depth}"></label><label class="full">希望完成的动作<textarea data-brief="notes">${esc(state.brief.notes)}</textarea></label></div><div class="reference">${state.reference?`<img src="${state.reference}" alt="你添加的场景参考">`:`<svg viewBox="0 0 110 70" aria-label="示例参考示意"><rect x="2" y="2" width="106" height="66" rx="4" fill="#dedfd8"/><path d="M14 50V19h51l29 13v28H40Z" fill="#f5f2e8" stroke="#9a9d94"/><path d="m14 50 26 10V32L14 19M40 32l54 0M53 46h28v4H53zm3 4v9m22-9v9M28 27v18" fill="none" stroke="#93998d"/><rect x="50" y="16" width="20" height="12" fill="#bdcbd1"/></svg>`}<div><strong class="smalltext">添加参考图与尺寸依据</strong><p>示例参考仅表达空间；照片不会自动成为尺寸证明。</p><input type="file" id="referenceFile" accept="image/png,image/jpeg,image/webp" aria-label="添加本地参考图"><span class="refcaption">本地预览，不上传；刷新后清空。</span></div></div><div class="note">已知：FR3 采用可信资产。待补：六孔试管架的几何与碰撞。本示例固定验收 FR3、工作台、台车与试管架。<br>装饰细节由 agent 自主安排，任务关键尺寸需明确。</div></div>${actionbar('确认后，agent 根据需求检索素材；可随时返回修改。')}</section>`;}
function assetCard(a,near=false){const installed=a.source==='local'||state.acquired.includes(a.id);return `<article class="asset-card ${state.selected.includes(a.id)?'selected':''}"><div class="asset-art" data-action="detail" data-id="${a.id}" role="button" tabindex="0" aria-label="查看 ${a.name} 详情">${assetIllustration(a.kind)}</div>${act(state.selected.includes(a.id)?'✓':'+','toggle',`data-id="${a.id}" aria-label="${state.selected.includes(a.id)?'移出':'选入'} ${a.name}"`,'asset-check '+(state.selected.includes(a.id)?'checked':''))}<div class="asset-info"><div class="row between"><h3>${a.name}</h3></div><p class="desc">${near?esc(a.reasons.join(' · ')):a.why}</p><div class="row gap8"><span class="tag ${installed?'green':'blue'}">${installed?'已在本地':'在线'}</span><span class="tiny muted">${a.bytes?a.bytes+' MiB':'固定版本'}</span></div><div class="row between tiny" style="margin-top:8px"><span>${a.width===null?'尺寸未知':Math.round(a.width*100)+' cm 宽'}</span><span class="${a.collision?'ok':'warn'}">${a.collision?'静态碰撞可用':a.collision===null?'碰撞未知':'仅布景'}</span></div><div class="asset-id" title="${a.version}">${a.version}</div></div></article>`;}
function assetsContent(){const r=matchAssets(ASSETS,{q:ui.query,scope:ui.scope,width:ui.maxWidth,collision:ui.onlyCollision,license:ui.onlyLicense});return `<section class="panel"><div class="panelhead"><div><span class="eyebrow">ASSET DISCOVERY / 02</span><h3 style="margin-top:4px">把需求变成合适的素材</h3></div><span class="tag">7 条演示数据</span></div><div class="pad"><form id="searchForm" class="searchbar"><input id="searchQuery" value="${esc(ui.query)}" placeholder="试试：实验台旁放容器的小推车" aria-label="自然语言检索"><button class="primary" type="submit">${icon('search')} 检索</button></form><div class="pillrow">${act('小推车 ≤ 60 cm','preset','','small')}${act('Franka FR3','query','data-value="Franka FR3"','small')}${act('查看全部','clearSearch','','small')}</div><div class="filters"><label>检索范围<select data-ui="scope"><option value="all" ${ui.scope==='all'?'selected':''}>全部 · 本地与在线</option><option value="local" ${ui.scope==='local'?'selected':''}>仅本地</option><option value="online" ${ui.scope==='online'?'selected':''}>仅在线</option></select></label><label>最大宽度 · cm<input type="number" min="1" data-ui="maxWidth" value="${ui.maxWidth}" placeholder="不限"></label><div style="padding-top:19px;display:grid;gap:5px"><label class="checkline"><input type="checkbox" data-ui="onlyCollision" ${ui.onlyCollision?'checked':''}>静态碰撞可用</label><label class="checkline"><input type="checkbox" data-ui="onlyLicense" ${ui.onlyLicense?'checked':''}>许可已准入</label></div></div><div class="note smalltext">${ui.query?`已解释：${esc(ui.query)}。`:'支持中英文名称和用途描述。'}${ui.maxWidth?`宽度 ≤ ${ui.maxWidth} cm。`:''}${ui.onlyCollision?'要求已验证碰撞。':''}未知属性不满足硬条件。<br><span class="tiny">本原型使用有限的关键词映射模拟语义检索；尺寸、资格与验证状态均为演示数据。</span></div>${state.selected.includes('large')&&!state.acquired.includes('large')?`<div class="note warning" style="margin:15px 0"><strong>大型移动台车 521.2 MiB，超过单包 512 MiB。</strong><p class="smalltext">${state.budgetRequest?'预算调整请求待用户决定；上限未变。':'Agent 可以更换候选或请用户调整预算，不能自行放宽。'}</p><div class="row" style="margin-top:10px">${act('改选较小的工具台车','smaller','','small')}${act('请求调整预算','requestBudget','','small')}</div></div>`:''}<div class="result-meta"><span>${r.strict.length} 个符合条件 · ${r.near.length} 个未满足或待核实</span><label class="checkline"><input type="checkbox" data-ui="near" ${ui.near?'checked':''}>另列近似候选</label></div><div class="asset-grid">${r.strict.length?r.strict.map(a=>assetCard(a)).join(''):'<div class="empty full"><h3>当前条件下没有合格候选</h3><p class="smalltext">可以主动调整条件，或查看待核实项；不会自动放宽筛选。</p></div>'}</div>${ui.near&&r.near.length?`<div class="rule"></div><h3 style="margin-bottom:12px">待核实 / 不满足条件</h3><div class="asset-grid">${r.near.map(a=>assetCard(a,true)).join('')}</div>`:''}${ui.actor==='agent'?`<div class="agent-result">${esc(JSON.stringify({query:ui.query,appliedFilters:{scope:ui.scope,maxWidthCm:ui.maxWidth||null,collisionRequired:ui.onlyCollision,licenseAdmitted:ui.onlyLicense},results:r.strict.map(a=>({id:a.id,widthM:a.width,source:a.source,unknowns:a.width===null?['width']:[],canAcquire:a.admitted&&a.bytes<=512})),nextCursor:null},null,2))}</div>`:''}<div class="rule"></div><div class="row between smalltext"><strong>场景清单 · ${state.selected.length} 项</strong><span class="muted">缺失试管架将进入补制流程</span></div><div class="selection-strip" style="margin-top:10px">${state.selected.map(id=>`<span class="selection-chip">${byId(id).name} ${byId(id).source==='local'||state.acquired.includes(id)?'✓':'待获取'}</span>`).join('')}</div></div>${actionbar('获取遵守单包 512 MiB、批量 2 GiB 上限。',act('继续灰盒','nextLayout','','small'))}</section>`;}
function layoutContent(){return `<section class="panel"><div class="panelhead"><div><span class="eyebrow">BLOCKOUT / 03</span><h3 style="margin-top:4px">先确认空间，再做细节</h3></div><span class="tag ${state.layout?'green':'amber'}">${state.layout?'已确认':'需要你确认'}</span></div>${scene()}<div class="pad stack"><div class="split"><label>台车位置调整 · 仅示意<input type="range" min="-70" max="70" step="5" data-move value="${state.cartOffset}"><span class="tiny">调整会撤销布局确认，后续版本需重新生成。</span></label><div class="requirement-summary"><strong>布局中的约束</strong><p>机器人整体位姿可调整；原始关节与惯量保持。试管架当前${state.rack==='ready'?'已补制':'为占位件'}。</p></div></div>${state.brief.robot!=='fr3'||!state.selected.includes('fr3')?`<div class="note error"><strong>缺少可信机器人，不能确认任务布局。</strong><p class="smalltext">按照片重建外观不能替代真实关节与惯量。</p><div class="row" style="margin-top:10px">${act('使用已有可信 FR3','robotRestore','','small')}${act('保留缺口，查看草稿','draft','','small')}</div></div>`:`<div class="approval">请确认房间尺度、工作台位置与任务净空。图中工作范围仅为示意，实际可达性留给平台验证。</div>`}</div>${actionbar('确认后 agent 可自主补制；若核心布局改变，需要重新确认。')}</section>`;}
function factoryContent(){return `<section class="panel"><div class="panelhead"><div><span class="eyebrow">ASSET FACTORY / 04</span><h3 style="margin-top:4px">补齐六孔试管架</h3></div><span class="tag blue">参数化建模</span></div><div class="pad stack"><div class="model-card"><div class="thumb">${assetIllustration('rack')}</div><div class="descblock"><h3>不在目录里的物件，也有明确制作路线</h3><p style="margin-top:7px">试管架影响插入与接触，采用确定的孔径和孔距。新增素材先入库，再由场景引用。</p><div class="pillrow"><span class="tag">6 孔</span><span class="tag">静态物件</span><span class="tag amber">任务关键</span></div></div></div><div class="fields"><label>孔径 · mm<input type="number" min="12" max="30" data-rack="hole" value="${state.hole}"></label><label>孔距 · mm<input type="number" min="16" max="60" data-rack="pitch" value="${state.pitch}"></label></div><div class="process">${['参数确认','Blender 制作','视觉 / 碰撞','打包入库'].map(t=>`<div class="${state.rack==='ready'?'finished':''}">${state.rack==='ready'?'✓ ':''}${t}</div>`).join('')}</div><div class="note">Blender MCP：执行脚本、查询尺寸、查看多角度结果。<br>工厂层：保留参数与来源，导出新素材，并交给平台验证。<br><span class="tiny">这里模拟调用；不会连接 Blender 或运行建模程序。</span></div><div class="split"><div class="requirement-summary"><strong>可信机器人</strong><p>直接复用官方资产；不以自建外观替代所需型号。</p></div><div class="requirement-summary"><strong>复杂非关键道具</strong><p>可选图生 3D；先确定服务、许可与独立预算。</p></div></div>${state.rack==='ready'?`<div class="row between"><span class="mono smalltext">labware/rack-six-slot@${state.rackRev}</span><span class="tag green">模拟已入库 · 待任务验证</span></div>`:''}</div>${actionbar('制作完成只说明有了素材，尚未证明场景任务成功。',act('前往场景组装','stage','data-value="4"','small'))}</section>`;}
function composeContent(){return `<section class="panel"><div class="panelhead"><div><span class="eyebrow">COMPOSITION / 05</span><h3 style="margin-top:4px">组合资产，不重建机器人</h3></div><span class="tag">USD 场景包</span></div><div class="pad stack"><div class="note">Blender 提供实例身份和布局位姿。工厂使用原始资产引用生成场景，保留可信物理数据。</div><div>${[['scene.yaml','场景与仿真设置'],['stage.usda','固定素材引用与布局变换'],['devices.yaml','设备绑定与场景配置'],['locations.yaml','当前布局下的示教位置']].map(([name,desc])=>`<div class="file-row">${icon('file')}<strong class="mono">${name}</strong><span class="spacer"></span><span class="muted">${desc}</span></div>`).join('')}</div><div class="requirement-summary"><strong>这个场景将引用</strong><div class="selection-strip" style="margin-top:10px">${state.selected.map(id=>`<span class="selection-chip mono">${byId(id).source==='local'?byId(id).version:byId(id).name+' · 固定来源'}</span>`).join('')}<span class="selection-chip mono">rack-six-slot@${state.rackRev||'待补制'}</span></div></div><div class="statuslist">${[['需求已确认',state.confirmed],['布局已确认',state.layout],['缺失试管架已补制',state.rack==='ready'],['选中在线素材已在本地',state.selected.every(id=>byId(id).source==='local'||state.acquired.includes(id))]].map(([t,ok])=>`<div class="statusrow"><i class="dot ${ok?'ok':'warn'}"></i><span>${t}</span><strong>${ok?'完成':'待完成'}</strong></div>`).join('')}</div></div>${actionbar('只会生成模拟版本，不写入真实资产库。')}</section>`;}
function validationContent(){const checked=state.validation!=='pending',failed=state.validation==='failed';return `<section class="panel"><div class="panelhead"><div><span class="eyebrow">VALIDATION / 06</span><h3 style="margin-top:4px">能看见，还要能运行</h3></div><span class="tag ${failed?'amber':checked?'green':''}">${failed?'有缺口':checked?'模拟通过':'等待验证'}</span></div><div class="stage-hero">${scene()}</div><div class="pad stack"><table class="check-table"><thead><tr><th>检查层</th><th>本次检查什么</th><th>模拟结果</th></tr></thead><tbody>${[['视觉','比例、材质、平台中实际显示',checked?'通过':'待检查'],['结构','固定引用、单位与设备绑定',checked?'通过':'待检查'],['物理','试管架孔洞、接触与碰撞',checked?(failed?'失败':'通过'):'待检查'],['任务','当前场景中的试管放置',checked?(failed?'被阻断':'通过'):'待检查']].map(([a,b,c])=>`<tr><td>${a}</td><td class="muted">${b}</td><td class="${c==='通过'?'ok':c==='失败'?'bad':'warn'}">${c}</td></tr>`).join('')}</tbody></table>${failed?`<div class="note error"><strong>孔洞看起来存在，碰撞体却把孔封住了。</strong><p class="smalltext">需要重做试管架碰撞，生成新素材和新场景版本。原失败版本保留，不能修改报告伪装通过。</p></div>`:`<div class="note">${checked?'本次目标的模拟结果已齐全，可以进入交付。':'当前没有验证结论。点击运行，查看各层结果。'}<br><span class="tiny">这是流程演示；没有运行 Newton，也不证明任何真实素材已通过。</span></div>`}${state.history.length?`<div class="statuslist">${state.history.map(v=>`<div class="statusrow"><span class="mono">lab-cell@${v.version}</span><span>试管架 @${v.rack}</span><strong class="${v.status==='碰撞失败'?'bad':''}">${v.status}</strong></div>`).join('')}</div>`:''}</div>${actionbar('交付不会绕过失败或缺失的验证。',act('尝试交付','deliver','','small'))}</section>`;}
function deliverContent(){const ready=state.validation==='passed';return `<section class="panel"><div class="panelhead"><span class="eyebrow">DELIVERY / 07</span><span class="tag ${ready?'green':'amber'}">${state.delivered?'模拟已交付':ready?'可以审阅':'尚不可交付'}</span></div><div class="pad"><div class="big-success"><div class="seal">${ready?'✓':'…'}</div><h2>${ready?'一个场景，一组可复用的成果':'先完成场景与任务验证'}</h2><p class="smalltext">${ready?'场景固定引用素材版本，后续更新不会替换已有场景。':'你仍可查看草稿；未知或失败不会自动变成通过。'}</p><div class="version">${state.assembled?'lab-cell@'+state.version:'Scene Draft'}</div></div><div class="grid3"><div class="requirement-summary"><strong>场景包</strong><p>USD 布局、绑定、示教</p></div><div class="requirement-summary"><strong>新素材</strong><p>六孔试管架与制作参数</p></div><div class="requirement-summary"><strong>交付依据</strong><p>来源、许可与模拟结果</p></div></div><div class="rule"></div><label class="checkline"><input type="checkbox" data-ui="offline" ${ui.offline?'checked':''}>模拟断网查看</label><p class="smalltext" style="margin-top:9px">${ui.offline?'已导入内容继续可用；在线目录只能查看缓存，新增获取需要网络。':'工厂原始文件与原始下载缓存可独立管理，已导入版本保留所需文件。'}</p><div class="rule"></div><div class="row">${act('查看草稿场景','draft','','small')}${act('导出演示摘要','export','','small')}${act('查看交付规划','roadmap','','small')}</div></div>${actionbar('这里的交付仅改变原型内存状态。')}</section>`;}
function stageContent(){return [briefContent,assetsContent,layoutContent,factoryContent,composeContent,validationContent,deliverContent][state.step]();}
function steps(){return `<nav class="steps" aria-label="场景构建步骤">${STAGES.map(([t],i)=>act(`<span class="circle">${complete(i)?'✓':i+1}</span>${t}`,'stage',`data-value="${i}" ${state.step===i?'aria-current="step"':''}`,'step '+(state.step===i?'active ':'')+(complete(i)?'done':''))).join('')}</nav>`;}
function VariantA(){return `${steps()}<div class="workspace"><div class="workbody">${stageContent()}<div class="changed" aria-live="polite">↳ ${esc(state.last)}</div></div>${context()}</div>`;}
function VariantB(){return `<div class="director"><div class="director-story"><div class="director-track"><span class="mono">0${state.step+1} / 07</span>${STAGES.map((_,i)=>`<i class="${i<=state.step?'filled':''}"></i>`).join('')}</div><div class="message"><span class="avatar">✦</span><div class="message-content"><span class="eyebrow">SCENE DIRECTOR</span><h2>${STAGES[state.step][0]}</h2><p>${agentAdvice[state.step][0]} ${agentAdvice[state.step][1]}</p></div></div>${stageContent()}<div class="row between">${act('← 上一步','stage',`data-value="${Math.max(0,state.step-1)}"`,'small')}${act('浏览下一步 →','stage',`data-value="${Math.min(6,state.step+1)}"`,'small')}</div><div class="changed">↳ ${esc(state.last)}</div></div><aside class="director-aside"><section class="panel">${scene()}</section>${statusPanel()}<section class="panel pad"><h3>这一刻的分工</h3><p class="smalltext" style="margin-top:9px">${agentAdvice[state.step][2]}</p></section></aside></div>`;}
function VariantC(){return `<div class="flow-label"><span class="eyebrow">BUILD JOURNEY / 全局流程</span><span class="smalltext muted">点击任一步骤，查看动作、约束与产物</span></div><div class="board-wrap"><div class="board">${STAGES.map(([t,d,owner],i)=>`<button class="board-column ${state.step===i?'active':''}" data-action="stage" data-value="${i}"><div class="row between"><span class="sectionnum">0${i+1}</span><span class="tag ${complete(i)?'green':state.step===i?'blue':''}">${complete(i)?'完成':state.step===i?'正在查看':'待推进'}</span></div><h3>${t}</h3><p>${d}</p><div class="owner">${owner}</div></button>`).join('')}</div></div><div class="board-detail"><div>${stageContent()}<div class="changed">↳ ${esc(state.last)}</div></div><div class="stack"><section class="panel">${scene()}</section>${statusPanel()}</div></div>`;}
function render(){document.body.className='variant-'+ui.variant;document.documentElement.dataset.theme=ui.theme;const names={A:'场景工作台',B:'引导式导演',C:'全局流程板'};document.getElementById('app').innerHTML=`<aside class="sidebar"><div class="brand">${icon('cube')}<div class="brandwords">Lab World<small>LOCAL LABORATORY</small></div></div><div class="sectionlabel">WORKSPACE</div>${act(icon('grid')+'<span class="navwords">项目概览</span>','roadmap','','sideitem')}${act(icon('layers')+'<span class="navwords">场景工厂</span>','stage','data-value="0"','sideitem active')}${act(icon('search')+'<span class="navwords">素材检索</span>','stage','data-value="1"','sideitem')}${act(icon('check')+'<span class="navwords">验证报告</span>','stage','data-value="5"','sideitem')}<div class="sectionlabel">BUILD TOGETHER</div>${act(icon('spark')+'<span class="navwords">人 / agent 协作</span>','actor','','sideitem')}${act(icon('file')+'<span class="navwords">交付规划</span>','roadmap','','sideitem')}<div class="sidefoot"><span class="row"><i class="dot" style="color:#a4a8e7"></i>设计探索 · PROTOTYPE</span><p style="color:inherit;margin-top:7px">不连接平台或 Blender。<br>刷新即重置数据。</p></div></aside><main class="app"><header class="topbar"><span>工作空间</span><span class="slash">/</span><strong>场景工厂</strong><span class="spacer"></span><span class="prototype-explain muted tiny">模拟数据 · 非真实执行</span><span class="proto-mark">INTERACTIVE PROTOTYPE</span>${act(icon('moon'),'theme','aria-label="切换明暗主题"','quiet btn-icon')}</header><section class="heading"><div><div class="eyebrow">FROM INTENT TO A RUNNABLE SCENE</div><h1>一起，搭建一个实验室。</h1><p>从用途与参考出发，复用可信素材，让缺失的部分有据可造。</p></div><div class="row heading-actions"><div class="mode-toggle">${act('用户视角','setActor','data-value="human"',ui.actor==='human'?'active':'')}${act('Agent 视角','setActor','data-value="agent"',ui.actor==='agent'?'active':'')}</div>${act('交付规划 '+icon('arrow'),'roadmap','','small')}</div></section><div class="experience"><span class="tag blue">自由探索</span><select id="scenario" aria-label="体验场景"><option value="happy" ${state.scenario==='happy'?'selected':''}>完整搭建流程</option><option value="unknown" ${state.scenario==='unknown'?'selected':''}>条件未知的候选</option><option value="budget" ${state.scenario==='budget'?'selected':''}>下载超过预算</option><option value="robot" ${state.scenario==='robot'?'selected':''}>缺少可信机器人</option><option value="collision" ${state.scenario==='collision'?'selected':''}>视觉通过，碰撞失败</option></select><span class="hint">${ui.guide?'每次点击“下一步演示”，执行一个真实的原型动作。':'要理解全流程，可以逐步演示；也可自由点击七个步骤。'}</span>${act(ui.guide?'下一步演示 →':'带我走一遍 →','guide','','small')}${act('重置','reset','','small')}</div>${ui.variant==='A'?VariantA():ui.variant==='B'?VariantB():VariantC()}</main><div class="switcher" aria-label="原型方案切换"><span class="legend">UI VARIANTS</span>${act('←','prevVariant','aria-label="上一种界面方案"')}${Object.keys(names).map(k=>act(k+' '+names[k],'variant',`data-value="${k}" aria-pressed="${ui.variant===k}"`,ui.variant===k?'active':'')).join('')}${act('→','nextVariant','aria-label="下一种界面方案"')}<span class="sep"></span>${act('状态','state','','state-btn')}</div>`;}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('visible'),5500);}
function dispatch(action){const previousStep=state.step;state=reduce(state,action);render();if(previousStep!==state.step)window.scrollTo(0,0);if(!['stage','move','brief','rackParam'].includes(action.type))notify(state.last);}
function setVariant(v){ui.variant=v;const url=new URL(location.href);url.searchParams.set('variant',v);try{history.replaceState(null,'',url);}catch{}render();window.scrollTo(0,0);}
function startScenario(name){clearTimeout(window.toastTimer);document.getElementById('toast').classList.remove('visible');window.scrollTo(0,0);state=initialState(name);Object.assign(ui,{query:'',scope:'all',maxWidth:'',onlyCollision:false,onlyLicense:true,near:false,guide:false,offline:false});if(name!=='happy'){state.confirmed=true;state.step=name==='robot'?2:name==='collision'?3:1;}if(name==='unknown'){ui.query='小推车';ui.maxWidth='60';ui.onlyCollision=true;ui.near=true;state.last='未知属性不能满足条件；待核实候选单独列出。';}if(name==='budget'){state.selected.push('large');ui.query='推车';state.last='尝试获取大型台车，观察 512 MiB 上限如何生效。';}if(name==='robot'){state.brief.robot='unknown';state.selected=['table'];state.last='当前型号没有可信资产。尝试确认布局，查看阻断原因。';}if(name==='collision'){state.layout=true;state.last='补制并组装后运行验证，观察碰撞失败与新版本修复。';}render();}
function guided(){if(!ui.guide){startScenario(state.scenario);ui.guide=true;render();notify('分步演示已开始。点击“下一步演示”推进；仍可自由操作。');return;}if(!state.confirmed)return dispatch({type:'confirm'});if(state.brief.robot!=='fr3'){if(state.last.includes('缺少可信机器人')){notify('请在布局页选择“使用已有可信 FR3”，或保留缺口。演示不会代你批准型号变更。');return;}return dispatch({type:'layout'});}if(state.selected.includes('large')&&!state.acquired.includes('large')){if(state.last.includes('超过单包'))return dispatch({type:'smaller'});return dispatch({type:'acquire'});}if(!state.selected.includes('cart'))return dispatch({type:'toggle',id:'cart'});if(!state.acquired.includes('cart'))return dispatch({type:'acquire'});if(!state.layout){if(state.step!==2)return dispatch({type:'nextLayout'});return dispatch({type:'layout'});}if(state.rack!=='ready')return dispatch({type:'build'});if(!state.assembled)return dispatch({type:'compose'});if(state.validation==='pending')return dispatch({type:'validate'});if(state.validation==='failed')return dispatch({type:'fix'});if(!state.delivered)return dispatch({type:'deliver'});openDrawer('roadmap');}
function openDrawer(type,id){ui.drawer={type,id};let html='';if(type==='roadmap'){html=`<span class="eyebrow">DELIVERY ROADMAP</span><h2>从原型，到可用的平台</h2><p>以下是计划中的交付能力。当前页面只演示交互，不表示能力已经实现。</p>${[['检索与目录','双语描述、自然语言与明确条件、属性依据。Web / CLI / MCP 同步交付。','能找到，并知道为什么合适'],['获取与入库','固定来源版本、许可与预算、进度／取消／重试；原始缓存与入库版本分开。','能按需获取，并离线复用'],['最小场景工厂','复用可信资产，补制一个静态物件，引用固定版本生成 USD 场景。','一条制作流程产出可导入的场景'],['Blender 桥接','复用 MCP for Blender；项目脚本处理实例身份、布局提取和素材打包。','人工摆放与 agent 脚本得到同类产物'],['Scene Director 编排','需求访谈 → 灰盒确认 → 自主细化 → 平台验收；图生 3D 为可选扩展。','用户说目标，agent 完成有依据的制作'],['端到端验收','真实检索质量、缺素材补制、预算与未知项、失败修复、离线使用与素材复用。','以实际平台结果交付']].map(([title,desc,goal],i)=>`<div class="roadmap-row"><div class="roadnum">0${i+1}</div><div class="timeline-line"><h3>${title}</h3><p>${desc}</p><span class="tag">${goal}</span></div></div>`).join('')}<div class="note">待验证的设计问题：你更喜欢场景工作台、引导式导演，还是全局流程板？三个方案共用同一份状态，切换不会丢失当前进度。</div>`;}else if(type==='state'){html=`<span class="eyebrow">PROTOTYPE STATE</span><h2>这一刻，系统知道什么</h2><p>这是完整的相关演示状态。所有数据仅在本页内存中，刷新后重置。</p><div class="rule"></div>${statusPanel()}<details style="margin-top:20px"><summary>展开原始状态（供设计核对）</summary><pre>${esc(JSON.stringify({...state,reference:state.reference?'[本地图片已加载]':'',ui:{variant:ui.variant,actor:ui.actor,scope:ui.scope,query:ui.query,maxWidth:ui.maxWidth,onlyCollision:ui.onlyCollision}},null,2))}</pre></details>`;}else if(type==='draft'){html=`<span class="eyebrow">SCENE DRAFT</span><h2>${state.delivered?'场景交付示意':'仅查看场景草稿'}</h2><p>草稿可用于沟通布局；未完成的验证不会因预览而变成通过。</p><div class="panel" style="margin-top:18px">${scene()}</div><div class="note" style="margin-top:18px">${esc(state.last)}</div>`;}else{const a=byId(id);html=`<span class="eyebrow">ASSET DETAIL / 模拟元数据</span><h2>${a.name}</h2><p>${a.origin}</p><div class="thumb-large">${assetIllustration(a.kind)}</div><div class="note">${a.why}</div><div class="rule"></div><div class="statuslist">${[['身份',a.version],['来源',a.source==='local'?'本地库':'在线目录'],['来源包大小',a.bytes?a.bytes+' MiB':'已在本地'],['宽度',a.width===null?'未知':a.width+' m'],['许可',a.license],['用途',a.collision?'静态碰撞可用（模拟）':a.collision===null?'未知':'仅布景（模拟）'],['获取资格',a.bytes>512?'超过单包预算':a.admitted?'策略内可获取（模拟）':'许可尚未准入']].map(([k,v])=>`<div class="statusrow"><span>${k}</span><strong style="overflow-wrap:anywhere;max-width:68%;text-align:right">${v}</strong></div>`).join('')}</div><div class="rule"></div><p class="smalltext">包名与部分来源体积参考公开目录；尺寸、资格和验证状态为了演示界面而设置，不能用于真实素材选择。</p><div class="row" style="margin-top:18px">${act(state.selected.includes(a.id)?'移出场景清单':'选入场景清单','toggle',`data-id="${a.id}"`,'primary')}</div>`;}document.getElementById('modal').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${type==='roadmap'?'交付规划':type==='state'?'演示状态':'详情'}">${act('✕','close','aria-label="关闭面板"','close quiet')}<div style="padding-top:7px">${html}</div></section></div>`;document.querySelector('.drawer .close').focus();}
function handleAction(type,el){const v=el.dataset.value,id=el.dataset.id;switch(type){case 'variant':setVariant(v);break;case 'prevVariant':case 'nextVariant':{const vs=['A','B','C'];setVariant(vs[(vs.indexOf(ui.variant)+(type==='nextVariant'?1:2))%3]);break;}case 'theme':ui.theme=ui.theme==='light'?'dark':'light';render();break;case 'setActor':ui.actor=v;render();break;case 'actor':ui.actor=ui.actor==='human'?'agent':'human';render();break;case 'view':ui.view=v;render();if(ui.drawer?.type==='draft')openDrawer('draft');break;case 'preset':ui.query='实验台旁放容器的小推车';ui.maxWidth='60';ui.onlyCollision=true;render();break;case 'query':ui.query=v;render();break;case 'clearSearch':Object.assign(ui,{query:'',scope:'all',maxWidth:'',onlyCollision:false,onlyLicense:true,near:false});render();break;case 'reset':startScenario(state.scenario);notify('已重置此案例。');break;case 'guide':guided();break;case 'state':case 'roadmap':case 'draft':openDrawer(type);break;case 'detail':openDrawer('detail',id);break;case 'close':ui.drawer=null;document.getElementById('modal').innerHTML='';break;case 'stage':dispatch({type,value:Number(v)});break;case 'toggle':dispatch({type,id});if(ui.drawer?.type==='detail')openDrawer('detail',id);break;case 'export':{const report={prototype:true,notice:'All execution/validation is simulated',brief:state.brief,selected:state.selected,downloadMiB:state.download,layoutConfirmed:state.layout,sceneVersion:state.version,validation:state.validation,history:state.history};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='scene-factory.prototype-summary.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('已导出演示摘要，包含明确的模拟标记。');break;}default:dispatch({type});}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){handleAction(el.dataset.action,el);return;}if(e.target.classList.contains('overlay')){ui.drawer=null;document.getElementById('modal').innerHTML='';}const obj=e.target.closest('[data-scene-object]');if(obj){ui.selectedObject=obj.dataset.sceneObject;render();notify('选中场景对象：'+({robot:'可信机器人',rack:'试管架',cart:'台车',table:'工作台',cabinet:'柜子'}[ui.selectedObject]||ui.selectedObject));}});
document.addEventListener('submit',e=>{if(e.target.id==='searchForm'){e.preventDefault();ui.query=document.getElementById('searchQuery').value;render();}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='scenario')return startScenario(el.value);if(el.id==='referenceFile'){const f=el.files[0];if(f){if(f.size>8*1024*1024){notify('原型参考图请小于 8 MiB。');return;}const reader=new FileReader();reader.onload=()=>dispatch({type:'reference',value:reader.result});reader.readAsDataURL(f);}return;}if(el.dataset.brief)return dispatch({type:'brief',key:el.dataset.brief,value:el.type==='number'?Number(el.value):el.value});if(el.dataset.rack)return dispatch({type:'rackParam',key:el.dataset.rack,value:Number(el.value)});if(el.hasAttribute('data-move'))return dispatch({type:'move',value:Number(el.value)});if(el.dataset.ui==='offline'){ui.offline=el.checked;dispatch({type:'offline',value:el.checked});return;}if(el.dataset.ui){ui[el.dataset.ui]=el.type==='checkbox'?el.checked:el.value;render();if(ui.drawer?.type==='draft')openDrawer('draft');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){ui.drawer=null;document.getElementById('modal').innerHTML='';return;}if(e.target.closest('input,textarea,select,[contenteditable]')||ui.drawer)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();handleAction(e.key==='ArrowLeft'?'prevVariant':'nextVariant',{dataset:{}});}if(e.key==='Enter'&&e.target.matches('[role=button][data-action]'))handleAction(e.target.dataset.action,e.target);});
/* Throwaway, deterministic SVG design illustration. No renderer, physics or network. */
function sceneIllustration(options = {}) {
  const n = (v, fallback, min, max) => Number.isFinite(Number(v)) ? Math.max(min, Math.min(max, Number(v))) : fallback;
  const width = n(options.roomWidth, 6, 2, 20), depth = n(options.roomDepth, 4, 2, 20);
  const detailed = !!options.detailed, rackReady = !!options.rackReady, collision = !!options.collision;
  const present = kind => !Array.isArray(options.presentAssets) || options.presentAssets.includes(kind);
  const robotTrusted = present('robot') && options.robotTrusted !== false;
  const ghost = kind => (kind === 'robot' ? !robotTrusted : !present(kind)) ? 'opacity=".28" stroke-dasharray="4 4"' : '';
  const robotLabel = robotTrusted ? '可信 FR3 素材' : '机器人 · 占位';
  const offset = n(options.cartOffset, 0, -1.3, 1.3);
  const requested = String(options.selected || '').toLowerCase();
  const selected = ['robot','rack','cart','table','cabinet'].find(k => requested.includes(k)) || (requested.includes('fr3') ? 'robot' : '');
  const c = {ink:'#494841', line:'#aaa99f', floor:'#eeeae2', wall:'#f8f6f0', shade:'#d3d1c7', paper:'#fffefa', indigo:'#646bce', pale:'#e3e5fa', blue:'#b8cbd3', muted:'#818078'};
  const title = options.view === 'top' ? '实验室俯视布局示意' : '实验室等距布局示意';
  const label = (x,y,t,anchor='start',fill=c.muted,size=12) => `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${fill}" font-size="${size}" font-family="Segoe UI,Microsoft YaHei,sans-serif">${t}</text>`;
  const line = (a,b,stroke=c.line,sw=1,extra='') => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${stroke}" stroke-width="${sw}" ${extra}/>`;
  const root = body => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-label="${title}" style="width:100%;height:100%;display:block"><title>${title}</title><desc>设计原型示意。包含工作台、${robotTrusted?'可信机器人示意':'机器人占位件'}、试管架、台车与示例布景柜体。未选素材以淡色占位；图形与尺寸仅用于理解流程，不代表实际物理仿真结果。</desc><g stroke-linejoin="round" stroke-linecap="round">${body}</g></svg>`;
  const tx = width*.22, ty = depth*.39, tw = width*.52, td = depth*.22;
  const cx = Math.max(width*.55,Math.min(width*.85,width*.77+offset)), cy = depth*.74;
  if (options.view === 'top') {
    const s = Math.min(88,610/width,360/depth), left = (900-width*s)/2, top = (560-depth*s)/2;
    const p = (x,y) => [left+x*s,top+y*s];
    const rect = (x,y,w,h,fill,stroke=c.line,extra='') => `<rect x="${p(x,y)[0]}" y="${p(x,y)[1]}" width="${w*s}" height="${h*s}" rx="3" fill="${fill}" stroke="${stroke}" ${extra}/>`;
    const mark = k => k === selected ? `stroke="${c.indigo}" stroke-width="3"` : `stroke="${c.line}" stroke-width="1.4"`;
    let b = label(30,34,'布局示意 · 俯视','start',c.muted,12) + label(870,34,detailed?'细化方案':'尺寸灰盒','end',c.muted,12);
    b += rect(0,0,width,depth,c.floor,c.line,'stroke-width="2"');
    for(let x=.5;x<width;x+=.5) b += line(p(x,0),p(x,depth),'#dedbd3',.7);
    for(let y=.5;y<depth;y+=.5) b += line(p(0,y),p(width,y),'#dedbd3',.7);
    b += line(p(width*.1,0),p(width*.49,0),c.blue,7);
    b += line(p(0,depth*.66),p(0,depth*.91),c.paper,6);
    b += `<path d="M ${p(0,depth*.66).join(' ')} h ${depth*.25*s} A ${depth*.25*s} ${depth*.25*s} 0 0 1 ${p(0,depth*.91).join(' ')}" fill="none" stroke="${c.line}" stroke-dasharray="3 3"/>`;
    b += `<g data-scene-object="cabinet">${rect(width*.76,depth*.04,width*.18,depth*.2,detailed?'#d9ded8':'#dedbd3',selected==='cabinet'?c.indigo:c.line,selected==='cabinet'?'stroke-width="3"':'')}${label(...p(width*.85,depth*.16),'柜体 · 示例布景','middle',c.ink,10)}</g>`;
    b += `<g data-scene-object="table" ${ghost('table')}><rect x="${p(tx,ty)[0]}" y="${p(tx,ty)[1]}" width="${tw*s}" height="${td*s}" rx="5" fill="${detailed?'#fcfbf7':'#dedbd3'}" ${mark('table')}/></g>${label(...p(tx+tw*.5,ty+td*.85),present('table')?'实验工作台':'工作台 · 未选占位','middle',c.muted,11)}`;
    const rp = p(tx+tw*.22,ty+td*.4);
    b += `<g data-scene-object="robot" ${ghost('robot')}><circle cx="${rp[0]}" cy="${rp[1]}" r="${s*.45}" fill="${c.pale}" fill-opacity=".5" stroke="${c.indigo}" stroke-dasharray="4 5"/><circle cx="${rp[0]}" cy="${rp[1]}" r="${s*.13}" fill="${c.shade}" stroke="${selected==='robot'?c.indigo:c.ink}" stroke-width="2"/><path d="M${rp[0]},${rp[1]} l${s*.27},${-s*.24} l${s*.3},${s*.14} l${s*.2},${s*.1}" fill="none" stroke="${c.ink}" stroke-width="${s*.13}"/><path d="M${rp[0]},${rp[1]} l${s*.27},${-s*.24} l${s*.3},${s*.14} l${s*.2},${s*.1}" fill="none" stroke="${detailed?c.paper:'#cecdc5'}" stroke-width="${s*.085}"/></g>`;
    b += label(...p(tx+tw*.2,ty-.12),robotTrusted?'FR3 · 固定素材':'机器人 · 占位','middle',robotTrusted?c.indigo:c.muted,11);
    const rackx = tx+tw*.67, racky=ty+td*.2;
    b += `<g data-scene-object="rack">${rect(rackx,racky,tw*.19,td*.3,rackReady?c.pale:'none',c.indigo,`stroke-width="${selected==='rack'?2.5:1.4}" ${rackReady?'':'stroke-dasharray="4 4"'}`)}`;
    if(rackReady) for(let x=0;x<3;x++) for(let y=0;y<2;y++) b += `<circle cx="${p(rackx+tw*(.035+x*.055),racky+td*(.085+y*.12))[0]}" cy="${p(rackx+tw*(.035+x*.055),racky+td*(.085+y*.12))[1]}" r="${s*.025}" fill="${c.indigo}"/>`;
    b += '</g>' + label(...p(tx+tw*.77,ty-.12),rackReady?'试管架 · 已补制':'试管架 · 占位','middle',c.indigo,11);
    b += `<g data-scene-object="cart" ${ghost('cart')}>${rect(cx-.27,cy-.23,.54,.46,detailed?'#eceef9':'#dddcd6',selected==='cart'?c.indigo:c.line,selected==='cart'?'stroke-width="3"':'')}</g>${label(...p(cx,cy+.07),present('cart')?'台车':'台车 · 未选占位','middle',c.ink,11)}`;
    if(detailed && present('cart')) b += rect(cx-.18,cy-.12,.15,.14,'#c0c8b9')+rect(cx+.03,cy-.12,.12,.14,c.pale);
