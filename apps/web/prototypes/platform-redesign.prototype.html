/* Lab Platform Redesign · design plan
   Direction  A quiet, instrument-grade workbench. Dark stone is the primary theme (after deeprsi); light is a warm paper: bipolar warm tooth, faint cloud and a top-left
              lamp on the ground only, so panels and figures sit on it as smooth card stock.
              Both neutrals carry a faint warm bias. One indigo accent marks only what is live, selected or proposed by
              the agent (running job, selected device, ghost arm, TCP path). Green / amber / red stay small dots until
              something is critical; only a critical alert tints a surface.
   Type       Noto Serif SC for display (titles, big numerals, card titles) · IBM Plex Sans for UI and body ·
              IBM Plex Mono for ids, numbers, eyebrows and figure numbers. Scale 10.5 / 12.5 / 14 / 15 / 17 / 19 / 26 / 32-48.
   Space      4 · 8 · 12 · 16 · 24 · 32 · 48 · 64. Radii 4 / 7 / 12 / 16.
   Surface    Hairlines first. Panels: 1px line, a 1px inner top highlight, a very soft long shadow. Dark: film grain over all.
   Figures    Three.js r128, one shared WebGL renderer copied into per-figure canvases: orthographic isometric camera,
              sky/ground + warm key light with soft shadow maps, blurred contact shadows, 1px crease edges for the drafted
              look, cutaway walls with poche tops, a floor grid that fades out. SVG line art is the no-WebGL fallback.
   Layout     One frame: a collapsible icon rail (A) beside the page. 概览 and 实况 are figure-first with a device
              drawer (from B); the libraries are B's card grid with a thumbnail list view; 计划, 训练 and 待审批 use C's
              loop strip, inbox and RSI board; everything else is A's panel console.
   Charts     Series take c1 indigo / c2 clay / c3 aqua (CVD-checked on both surfaces); accent stays for live and agent
              items, green / amber / red stay status. Labels in text tokens, never the series colour. */

  --grain-o:.16;

  --sans:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",monospace;

}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ground);background-image:var(--paper);background-size:var(--paper-size);background-attachment:var(--paper-att);color:var(--ink);font:400 var(--fs-ui)/1.6 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-kerning:normal}
body::after{content:"";position:fixed;inset:0;z-index:40;pointer-events:none;background-image:var(--grain);background-size:220px 220px;opacity:var(--grain-o)}
::selection{background:color-mix(in oklab,var(--accent) 34%,transparent);color:var(--ink)}
h1,h2,h3,h4,p,figure,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;margin:0;-webkit-tap-highlight-color:transparent;text-align:inherit}
button,textarea,.stp,.ni,.rtog,.stg,.tab,.card .fg,tr.row,.pt,.lk,.sw .k,.sw .k::after,.segc span{transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease),text-decoration-color var(--dur) var(--ease)}
code,.mono{font-family:var(--mono);font-size:.88em;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
code{color:var(--ink-2);overflow-wrap:anywhere}
b,strong{font-weight:500;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 128px;max-width:1520px;margin:0 auto}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.eb{font:500 11px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.eb code{text-transform:none;letter-spacing:0;font-size:1em;color:inherit}
.mt{color:var(--muted)}
.ft{color:var(--faint)}
.sm{font-size:12px}
.fc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:12px;font-size:var(--fs-sm);line-height:1.5;color:var(--muted)}
.fc>b{font:500 11px/1 var(--mono);letter-spacing:.06em;color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:20px;min-width:0}
.tight{display:grid;gap:12px;min-width:0}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.split.wr{grid-template-columns:minmax(0,1fr) 400px}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:48px;align-items:start}
@media(max-width:1100px){.split,.split.wr,.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr);gap:28px}}

/* ---------- atoms ---------- */
.chip{--t:var(--faint);display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:999px;font:500 11.5px/1 var(--sans);color:var(--ink-2);background:color-mix(in oklab,var(--t) 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--t) 24%,transparent);white-space:nowrap;vertical-align:middle;font-variant-numeric:tabular-nums}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--t);flex:none}
.chip.ok{--t:var(--ok)}.chip.warn{--t:var(--warn)}.chip.run{--t:var(--accent)}
.chip.bad,.chip.gap{--t:var(--bad);color:var(--bad);background:color-mix(in oklab,var(--bad) 12%,transparent)}
.chip.na{--t:var(--ghost);color:var(--muted);background:transparent}
.chip.na i{background:transparent;box-shadow:inset 0 0 0 1.2px var(--ghost)}
.chip.run i{animation:pulse 2.2s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent) 60%,transparent)}70%,100%{box-shadow:0 0 0 6px transparent}}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--r1);font:400 11px/1 var(--mono);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2);white-space:nowrap;vertical-align:middle}
.tag.ac{color:var(--accent-ink);background:color-mix(in oklab,var(--accent) 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 38%,transparent)}
.demo{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:3px;font:400 10px/1 var(--mono);letter-spacing:.06em;color:var(--faint);border:1px dashed var(--line-2);white-space:nowrap;vertical-align:middle}
.bd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font:500 10.5px/1 var(--mono);background:var(--ink);color:var(--ground);font-variant-numeric:tabular-nums}
.bd.al{background:var(--bad);color:var(--on-bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 14px;border-radius:var(--r2);font:500 13px/1 var(--sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);box-shadow:var(--bevel);white-space:nowrap}
.btn:hover{border-color:var(--ghost);background:color-mix(in oklab,var(--surface-2) 70%,var(--line-2))}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.pri{background:var(--ink);color:var(--ground);border-color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.pri:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.sm{height:26px;padding:0 10px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btn .ic{width:14px;height:14px}
.lk{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-size:13px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:var(--ghost)}
.lk:hover{text-decoration-color:var(--ink)}
.lk .ic{width:13px;height:13px}
.lk.back{text-decoration:none;color:var(--muted);font-size:12.5px}.lk.back:hover{color:var(--ink)}
.sw{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 11px 0 5px;border-radius:999px;font:500 12px/1 var(--sans);color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--bevel)}
.sw:hover{border-color:var(--ghost)}
.sw .k{position:relative;width:26px;height:16px;border-radius:999px;background:var(--line-2)}
.sw .k::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--ink-2);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-pressed="true"] .k{background:var(--accent)}
.sw[aria-pressed="true"] .k::after{transform:translateX(10px);background:var(--on-accent)}
.segc{display:inline-flex;padding:2px;border-radius:9px;background:var(--ground-2);border:1px solid var(--line)}
.segc span{padding:5px 11px;border-radius:7px;font:500 12px/1.2 var(--sans);color:var(--muted)}
.segc span.on{background:var(--surface-2);color:var(--ink);box-shadow:var(--bevel),inset 0 0 0 1px var(--line-2)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots b{width:7px;height:7px;border-radius:50%;background:var(--ink-2);opacity:.5}
.dots b.warn{background:var(--warn);opacity:1}.dots b.gap{background:var(--bad);opacity:1}
.dots b.na{background:transparent;box-shadow:inset 0 0 0 1.2px var(--ghost);opacity:1}
.meter{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:inherit;background:var(--ink-2)}
.hint{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r2);font-size:13px;line-height:1.5;color:var(--ink-2);--t:var(--warn);background:color-mix(in oklab,var(--t) 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--t) 22%,transparent)}
.hint .ic{color:var(--t);margin-top:2px}
.hint.info{--t:var(--accent)}.hint.bad{--t:var(--bad)}
.cmd{display:flex;align-items:center;gap:10px;padding:5px 5px 5px 12px;border-radius:var(--r2);background:var(--ground-2);border:1px solid var(--line);min-width:0}
.cmd code{flex:1;min-width:0;white-space:nowrap;overflow-x:auto;font-size:12px;color:var(--ink-2);scrollbar-width:none}
.cmd code::before{content:"$ ";color:var(--faint)}
textarea{display:block;width:100%;min-height:64px;background:var(--ground);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r2);padding:10px 12px;font:400 13px/1.55 var(--sans);resize:vertical}
textarea::placeholder{color:var(--faint)}
textarea:hover{border-color:var(--ghost)}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%,transparent)}
textarea:disabled{opacity:.55;cursor:not-allowed}

/* ---------- tables & lists ---------- */
.tw{overflow-x:auto;--tp:8px;margin-inline:calc(var(--tp) * -1);min-width:0}
.stack>*,.tight>*,.split>*,.g2>*,.two>*,.devs>*,.pb>*{min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font:500 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 14px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:bottom}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:baseline}
th:first-child,td:first-child{padding-left:var(--tp)}
th:last-child,td:last-child{padding-right:var(--tp)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td code{white-space:nowrap}
td .sub{display:block;color:var(--faint);font-size:12px;margin-top:2px}
@media(max-width:640px){.tw table:has(th:nth-child(4)){min-width:560px}.tw table:has(th:nth-child(6)){min-width:680px}}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--row-hover)}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.kv>div:last-child{border-bottom:0}
.kv dt{font-size:12.5px;color:var(--muted);flex:none}
.kv dd{text-align:right;color:var(--ink);min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kv dd .bad{color:var(--bad)}
.cl li{display:grid;grid-template-columns:118px 76px minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cl li:last-child{border-bottom:0}
.cl small{color:var(--faint);font-size:12px}
@media(max-width:520px){.cl li{grid-template-columns:minmax(0,1fr) auto}.cl small{grid-column:1/-1}}

/* ---------- panels & figures ---------- */
.pn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow-1);min-width:0}
.pn>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px;min-height:46px}
.pn>header h3{font:500 13.5px/1.35 var(--sans);color:var(--ink);display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.pn>header .x{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pb{padding:8px 16px 16px;min-width:0}
.fig{margin:0;min-width:0}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/10;border-radius:var(--r3);background:radial-gradient(120% 95% at 50% 36%,var(--stage-1),var(--stage-2));overflow:hidden;isolation:isolate;container-type:inline-size}
.stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:22px 22px;-webkit-mask-image:radial-gradient(70% 70% at 50% 45%,#000 20%,transparent 78%);mask-image:radial-gradient(70% 70% at 50% 45%,#000 20%,transparent 78%)}
.stage.wide{aspect-ratio:16/9}.stage.hero{aspect-ratio:16/11}.stage.big{aspect-ratio:16/10}.stage.thumb{aspect-ratio:4/3;border-radius:0;background:transparent}.stage.thumb::before{display:none}.stage.env{aspect-ratio:4/3;border-radius:var(--r2)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.stage.inter.hov canvas{cursor:pointer}
.stage .ov{position:absolute;inset:0;z-index:2;pointer-events:none}
.stage .fb{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:14px}
.stage .fb svg{max-width:100%;max-height:100%;width:auto;height:100%}
.stage .chr{position:absolute;z-index:3;left:12px;top:10px;font:500 10.5px/1 var(--mono);letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
@media(max-width:600px){.stage.wide,.stage.hero{aspect-ratio:4/3}}
.pin{position:absolute;width:0;height:0}
.pin .pd{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px color-mix(in oklab,var(--stage-1) 80%,transparent)}
.pin .pl{position:absolute;left:-.5px;bottom:0;width:1px;height:var(--h,18px);background:linear-gradient(var(--ink),color-mix(in oklab,var(--ink) 25%,transparent));opacity:.55}
.pin .pt{position:absolute;left:var(--dx,0px);bottom:var(--h,18px);transform:translateX(-50%);display:inline-flex;align-items:baseline;gap:7px;white-space:nowrap;padding:4px 8px;border-radius:6px;font:500 11px/1.25 var(--mono);color:var(--ink);background:color-mix(in oklab,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px var(--line-2),0 6px 16px -8px rgba(0,0,0,.45);pointer-events:auto}
.pin .pt .pv{color:var(--muted);font-weight:400}
.pin button.pt{cursor:pointer}
.pin button.pt:hover,.pin.hv .pt{box-shadow:inset 0 0 0 1px var(--ghost),0 6px 16px -8px rgba(0,0,0,.45)}
.pin.on .pt{background:var(--ink);color:var(--ground);box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.pin.on .pt .pv{color:color-mix(in oklab,var(--ground) 70%,var(--ink))}
.pin.on .pd{background:var(--accent)}
.pin.al .pt{color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--bad) 45%,transparent),0 6px 16px -8px rgba(0,0,0,.45)}
.pin.al .pt .pv{color:var(--bad)}
.pin.ac .pd{background:var(--accent)}
.pin.ac .pt{color:var(--accent-ink);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 45%,transparent)}
.pin.ok .pt{color:var(--ok)}
.pin.ok .pd,.pin.ok .pl{display:none}
.pin.ok .pt{bottom:0}
@container (max-width:560px){.pin .pt{font-size:10px;padding:3px 6px;gap:5px}.pin.nm .pv{display:none}}
span.adot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px color-mix(in oklab,var(--bad) 22%,transparent)}
span.adot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--bad);animation:ring 1.9s var(--ease) infinite}
span.adot.ack{background:var(--stage-1);box-shadow:inset 0 0 0 1.6px var(--bad)}
span.adot.ack::after{display:none}
@keyframes ring{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.5);opacity:0}}
svg.tcp{position:absolute;inset:0;overflow:visible}
.tcp-l{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 5;stroke-linecap:round;animation:march 1.2s linear infinite}
.tcp-s{fill:var(--stage-1);stroke:var(--accent);stroke-width:1.4}
.tcp-t{fill:none;stroke:var(--accent);stroke-width:1.4}
.tcp-c{fill:var(--accent)}
@keyframes march{to{stroke-dashoffset:-20}}

/* fallback SVG line art */
svg.iso,svg.tvs{display:block;width:100%;height:auto}
.t,.l,.r,.fl,.wall,.win{stroke:var(--faint);stroke-width:1;stroke-linejoin:round}
.t{fill:var(--surface)}.l{fill:var(--ground)}.r{fill:var(--surface-2)}.fl{fill:var(--surface)}.wall{fill:none;stroke:var(--line-2)}.win{fill:var(--surface-2)}
.gr{stroke:var(--line);fill:none}.ln{stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round;fill:none}.jt{fill:var(--ground);stroke:var(--ink)}.tb{fill:var(--muted);stroke:none}.live{fill:var(--accent);stroke:var(--accent)}
.hot{stroke:var(--accent)!important;stroke-width:1.8!important}
.eq{cursor:pointer}
.lbl{font:10px var(--mono);fill:var(--muted)}.ok-t{font:10px var(--mono);fill:var(--ok)}
.rd{font:10px var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--ground);stroke-width:3px;stroke-linejoin:round}
circle.adot{fill:var(--bad);stroke:var(--ground);stroke-width:1.5}circle.adot.ack{fill:none;stroke:var(--bad)}
.gh{opacity:.65}.gh .ln{stroke:var(--accent);stroke-dasharray:3 3}.gh .t,.gh .l,.gh .r{stroke:var(--accent);fill:none}
.pth{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 4}

/* ---------- charts ---------- */
.spk{display:block;flex:none;overflow:visible}
.sg{stroke:var(--line);stroke-width:1;stroke-dasharray:1 3}
.st-t{font:400 8.5px var(--mono);fill:var(--faint)}
.chd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.chd b{font:500 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.ch{display:block;width:100%;height:auto;overflow:visible}
.ch .cg{stroke:var(--line);stroke-width:1}
.ch .cg0{stroke:var(--line-2);stroke-width:1}
.ch .ct{font:400 9.5px var(--mono);fill:var(--faint);font-variant-numeric:tabular-nums}
.ch .cl{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.ch .cnow{stroke:var(--ghost);stroke-dasharray:2 3}
.ch .cv{font:500 10.5px var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.ch .ci{fill:color-mix(in oklab,var(--ink) 10%,transparent)}
.ch .cw{stroke:var(--ink-2);stroke-width:1.2}
.ch .cp{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.ch .ctg{stroke:var(--ok);stroke-dasharray:5 4;stroke-width:1.2}
.ch .cbs{stroke:var(--warn);stroke-dasharray:2 3;stroke-width:1.2}
.ch .cpend{stroke:var(--ghost);stroke-dasharray:3 4}
.bud{display:grid;gap:12px}
.bu{display:grid;grid-template-columns:72px minmax(0,1fr) 92px;align-items:center;gap:12px;font-size:12.5px}
.bu .bl{color:var(--muted)}
.bu .bt{position:relative;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.bu .bt i{display:block;height:100%;border-radius:inherit;background:var(--ink-2)}
.bu .bv{text-align:right;font:400 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.bu.warn .bt i{background:var(--warn)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow-1);overflow:hidden}
.stat>div{padding:14px 18px 16px;border-left:1px solid var(--line);margin-left:-1px;display:grid;gap:6px;align-content:start}
.stat b{font:500 24px/1.1 var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums;color:var(--ink)}
.stat b small{font-size:14px;color:var(--faint);font-weight:400}
.prog{display:block;height:3px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:inherit}

/* ---------- live devices ---------- */
.devs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.prs{display:grid}
.pr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr-m{display:grid;gap:3px;min-width:0}
.pr-k{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.pr-k code{font-size:10.5px;color:var(--faint)}
.pr-v{display:flex;align-items:baseline;gap:5px}
.pr-v b{font:500 19px/1.15 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pr-v .u{font-size:12px;color:var(--faint)}
.pr.al .pr-v b{color:var(--bad)}
.pr.st .pr-v b{color:var(--faint)}
.pr-c{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.pr-c small{color:var(--faint);font-size:11.5px}
.pr-na{color:var(--faint);font:400 12px var(--mono);width:148px;text-align:right}
.devc{display:grid;gap:4px;padding-top:14px;border-top:1px solid var(--line-2)}
.devh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.alb{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px 12px 14px;border-radius:var(--r3);background:color-mix(in oklab,var(--bad) 7%,var(--surface));border:1px solid color-mix(in oklab,var(--bad) 34%,var(--line));box-shadow:var(--shadow-1)}
.alb .ai{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--bad) 14%,transparent)}
.alb .ai span.adot{position:static;margin:0}
.alb .t1{font-weight:500;color:var(--ink);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.alb .t1 b{color:var(--bad);font:500 14px var(--mono)}
.alb .t2{font-size:12.5px;color:var(--muted)}
.alb .acts{display:flex;gap:10px;align-items:center}
@media(max-width:640px){.alb{grid-template-columns:auto minmax(0,1fr)}.alb .acts{grid-column:1/-1}}

/* ---------- plan steps ---------- */
.steps{display:grid;gap:2px}
.steps li{position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;left:21.5px;top:34px;bottom:-11px;width:1px;background:var(--line-2);z-index:0}
.steps li.d::after{background:var(--ink-2);opacity:.6}
.stp{position:relative;z-index:1;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;padding:10px 10px 10px 8px;border-radius:var(--r2)}
.stp:hover{background:var(--row-hover)}
.stp.on{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.si{width:20px;height:20px;display:block;margin:1px 0 0 4px}
.si .f{fill:var(--ink-2)}.si .c{fill:none;stroke:var(--surface);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.si.ok .f{fill:color-mix(in oklab,var(--ok) 16%,var(--surface));stroke:var(--ok);stroke-width:1.2}.si.ok .c{stroke:var(--ok)}
.si .r{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2}
.si .a{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;transform-origin:10px 10px;animation:spin 1.6s linear infinite}
.si .dd{fill:var(--accent)}
.si text{font:500 9px var(--mono);fill:var(--faint)}
@keyframes spin{to{transform:rotate(360deg)}}
.stp .sc{display:grid;min-width:0}
.stp .s1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:22px}
.stp .sp{flex:1}
.stp .s0{font-size:11.5px;color:var(--faint);margin-top:2px}
.stp .s1 .eb{color:var(--muted)}
.stp .s2{font:400 12.5px/1.45 var(--mono);color:var(--ink);margin-top:2px;overflow-wrap:anywhere}
.stp small{display:block;color:var(--faint);font-size:12px;margin-top:3px}
.stp.on .s2{color:var(--ink)}

/* ---------- approvals ---------- */
.ap{display:grid;gap:14px;padding:20px;border-radius:var(--r3);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);min-width:0}
.ap .ah{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ap h4{font:500 18px/1.4 var(--serif);color:var(--ink);text-wrap:balance;letter-spacing:-.005em}
.ap .apb{color:var(--muted);max-width:68ch;font-size:13.5px}
.ap .by{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.ap .by b{font-weight:500;color:var(--ink-2)}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:500 10px/1 var(--mono);background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.av.ag{color:var(--accent-ink);background:color-mix(in oklab,var(--accent) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 36%,transparent)}
.ap .nt{display:grid;gap:6px}
.ap .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.ap.approved,.ap.rejected{background:var(--ground-2);box-shadow:none}
.ap.approved h4,.ap.rejected h4{color:var(--ink-2)}
.ivg{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:24px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ivg p{font-size:13.5px}
.ivg .eb{display:block;margin-bottom:6px}
@media(max-width:760px){.ivg{grid-template-columns:minmax(0,1fr)}}
.ivg .tw{--tp:0px;margin-inline:0}
.ivg td{padding-block:8px}

/* ---------- prototype pill ---------- */
.pk{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 5px;border-radius:999px;background:var(--pk-bg);color:var(--pk-ink);box-shadow:var(--shadow-2)}
.pk .pm{font:500 9.5px/1 var(--mono);letter-spacing:.12em;padding:6px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.pk button{height:28px;padding:0 11px;border-radius:999px;color:var(--pk-ink);font:500 12px/1 var(--sans);white-space:nowrap}
.pk button:hover{background:var(--pk-line)}
.pk button:active{transform:scale(.96)}
.pk button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ================= frame · instrument console (A) ================= */
.A{display:grid;grid-template-columns:212px minmax(0,1fr);gap:36px;align-items:start;transition:grid-template-columns 240ms var(--ease),gap 240ms var(--ease)}
.A .rail{position:sticky;top:24px;z-index:20;display:grid;gap:20px;align-content:start;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;min-width:0}
.brand .mk{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--surface);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line);color:var(--ink)}
.brand .mk svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.brand .bt2{display:grid;gap:2px;min-width:0}
.brand b{font:500 18px/1.2 var(--serif);letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.brand small{font:400 11px/1.3 var(--mono);color:var(--faint);letter-spacing:.02em;white-space:nowrap}
.A .rail nav{display:grid;gap:2px}
.ni{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:10px;height:35px;padding:0 10px;border-radius:var(--r2);color:var(--muted);font:500 13.5px/1 var(--sans);text-align:left;white-space:nowrap}
.ni .ic{opacity:.8}
.ni:hover{color:var(--ink);background:var(--row-hover)}
.ni.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line)}
.ni.on .ic{color:var(--accent);opacity:1}
.ni .nl{overflow:hidden;text-overflow:ellipsis}
.bdot{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px color-mix(in oklab,var(--warn) 22%,transparent);justify-self:end;margin-right:5px}
.rfoot{display:grid;gap:9px;padding:16px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.rfoot .li{display:flex;align-items:center;gap:8px;min-width:0}
.rfoot .li i{width:6px;height:6px;border-radius:50%;background:var(--ghost);flex:none}
.rfoot .li i.on{background:var(--accent);animation:pulse 2.2s var(--ease) infinite}
.rtog{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr);align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r2);color:var(--faint);font:500 12.5px/1 var(--sans);text-align:left;white-space:nowrap;border-top:1px solid transparent}
.rtog:hover{color:var(--ink);background:var(--row-hover)}
@media(min-width:901px){
  .A.rc{grid-template-columns:44px minmax(0,1fr);gap:28px}
  .A.rc .bt2,.A.rc .nl,.A.rc .rfoot{display:none}
  .A.rc .brand{padding:2px 9px}
  .A.rc .ni,.A.rc .rtog{display:flex;justify-content:center;padding:0;width:44px}
  .A.rc .ni .bd{position:absolute;top:1px;right:0;min-width:15px;height:15px;padding:0 4px;font-size:9.5px;box-shadow:0 0 0 2px var(--ground)}
  .A.rc .ni .bdot{position:absolute;top:8px;right:9px;margin:0}
  .A.rc [data-tip]:hover::after,.A.rc [data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);z-index:45;padding:6px 9px;border-radius:6px;background:var(--pk-bg);color:var(--pk-ink);font:500 12px/1.2 var(--sans);white-space:nowrap;box-shadow:var(--shadow-2);pointer-events:none}
}
.A main{min-width:0}
.A .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:26px}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;font-size:12.5px;color:var(--faint)}
.crumb .ic{width:12px;height:12px;opacity:.6}
.crumb b{color:var(--ink-2);font-weight:500}
.crumb code{font-size:11.5px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 24px;flex-wrap:wrap;margin-bottom:24px}
.ph>div:first-child{min-width:0}
.ph h1{font:400 30px/1.15 var(--serif);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.ph p{margin-top:8px;color:var(--muted);font-size:13px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.ph .act{display:flex;gap:10px;flex-wrap:wrap;align-items:center;max-width:100%}
.ovg{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.insp{display:grid}
.insp .is{padding:14px 16px 12px;border-top:1px solid var(--line)}
.insp .is:first-child{border-top:0}
.insp .ish{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;min-height:22px}
.stack.loose{gap:32px}
@media(max-width:1180px){.ovg{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
  .A{grid-template-columns:minmax(0,1fr);gap:18px}
  .A .rail{position:static;gap:12px}
  .A .rail nav{display:flex;overflow-x:auto;gap:4px;padding:2px 2px 6px;scrollbar-width:none}
  .ni{flex:none;display:inline-flex;height:32px;gap:7px}
  .rfoot,.rtog,.brand small{display:none}
  .brand{padding:0}
}

/* ---------- figure-first pages (from B) ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;align-items:start}
.drawer{border-left:1px solid var(--line);padding-left:24px;display:grid;gap:14px;align-content:start;min-width:0}
.drawer h3{font:400 21px/1.3 var(--serif);text-wrap:balance;overflow-wrap:anywhere}
.dl{display:grid}
.dl button{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2);text-align:left}
.dl button:hover{color:var(--ink)}
.dl button i{width:6px;height:6px;border-radius:50%;background:var(--ghost)}
.dl button i.w{background:var(--warn)}.dl button i.g{background:var(--bad)}
.dl button span:last-child{font:400 11px var(--mono);color:var(--faint)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{font:400 22px/1.25 var(--serif);letter-spacing:-.01em}
.sh .eb{white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 24px}
.card{display:grid;gap:8px;align-content:start;text-align:left;width:100%;min-width:0}
.card .fg{display:block;border-radius:var(--r3);background:radial-gradient(110% 90% at 50% 35%,var(--stage-1),var(--stage-2));border:1px solid var(--line);overflow:hidden}
.card:hover .fg{border-color:var(--line-2);box-shadow:var(--shadow-1);transform:translateY(-2px)}
.card .fc{margin-top:4px}
.card .h4{font:500 15px/1.35 var(--sans);color:var(--ink)}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px}
.feed li{display:grid;grid-template-columns:64px 170px minmax(0,1fr);gap:16px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.feed li:last-child{border-bottom:0}
.feed .tm{font:400 12px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.feed .who{font-size:12.5px;color:var(--muted)}
.feed .who i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;background:var(--ghost);vertical-align:1px}
.feed li.agent .who i{background:var(--accent)}.feed li.human .who i{background:var(--ink)}.feed li.system .who i{border-radius:1px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:960px){.hero{grid-template-columns:minmax(0,1fr);gap:22px}.drawer{border-left:0;padding-left:0;border-top:1px solid var(--line-2);padding-top:18px}}
@media(max-width:640px){.feed li{grid-template-columns:52px minmax(0,1fr)}.feed .tx{grid-column:2}}
@media(max-width:560px){.cards{grid-template-columns:minmax(0,1fr)}}

/* ---------- RSI loop pages (from C) ---------- */
.strip{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));overflow-x:auto;border:1px solid var(--line);border-radius:var(--r3);background:var(--surface);box-shadow:var(--shadow-1);margin-bottom:20px;scrollbar-width:thin}
.stg{position:relative;display:grid;gap:6px;align-content:start;padding:15px 18px 17px;text-align:left;border-right:1px solid var(--line);min-width:0}
.stg:last-child{border-right:0}
.stg:hover{background:var(--row-hover)}
.stg.on{background:var(--surface-2)}
.stg.on::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:0 0 2px 2px;background:var(--accent)}
.stg .ct2{font:400 30px/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.stg .gp{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.35;color:var(--muted)}
.stg .gp i{width:6px;height:6px;border-radius:50%;background:var(--ghost);flex:none}
.stg .gp.w i{background:var(--warn)}.stg .gp.b i{background:var(--bad)}
.stg .ar{position:absolute;right:-11px;top:50%;margin-top:-11px;z-index:3;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--faint)}
.stg .ar .ic{width:11px;height:11px;stroke-width:1.8}
.cmain{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.cmain>main{min-width:0}
.tla{position:sticky;top:20px}
.inbox>header h3{font:500 15px/1.3 var(--serif)}
.inbox .ap{border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;background:transparent;padding:18px 16px}
.inbox .empty{padding:18px 16px 20px;color:var(--muted);display:flex;gap:10px;align-items:center}
.tl{position:relative;display:grid;gap:16px;padding-left:20px}
.tl::before{content:"";position:absolute;left:4.5px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl li{position:relative;display:grid;gap:2px;font-size:13px;line-height:1.5}
.tl li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.4px var(--ghost)}
.tl li.agent::before{box-shadow:inset 0 0 0 1.6px var(--accent)}
.tl li.human::before{background:var(--ink);box-shadow:none}
.tl li.system::before{border-radius:2px;width:9px;height:9px;left:-19.5px}
.tl .tm{font:400 11px var(--mono);color:var(--faint);display:flex;gap:8px}
.tl .tx{color:var(--ink-2)}
@media(max-width:1060px){.cmain{grid-template-columns:minmax(0,1fr)}.tla{position:static}}
.tv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.alb{margin:0}

/* ---------- controls ---------- */
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--ground-2);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:7px;font:500 12.5px/1 var(--sans);color:var(--muted);white-space:nowrap;flex:none}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:var(--bevel),inset 0 0 0 1px var(--line-2)}
.seg button code{font-size:11px;color:inherit}
.seg .ic{width:14px;height:14px}
.tabs{display:flex;gap:4px 28px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:7px;padding:10px 0 12px;font:500 14px/1 var(--sans);color:var(--muted);white-space:nowrap;flex:none}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:1px;background:var(--ink)}
.tab .n{font:400 11px var(--mono);color:var(--faint)}
.ltb{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin-bottom:22px}
.ltb .sp,.keyrow .sp{flex:1}
.flt{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.fld{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;min-width:0}
.sel{position:relative;display:inline-flex}
.sel select,.fld input{-webkit-appearance:none;appearance:none;height:30px;padding:0 30px 0 11px;border-radius:var(--r2);border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:500 12.5px/1 var(--sans);box-shadow:var(--bevel);cursor:pointer;max-width:100%}
.fld input{padding:0 9px;font:400 12px/1 var(--mono)}
.sel .ic{position:absolute;right:9px;top:50%;width:12px;height:12px;margin-top:-6px;pointer-events:none;transform:rotate(90deg);color:var(--faint)}
.sel select:hover,.fld input:hover{border-color:var(--ghost)}

/* ---------- library list ---------- */
.stage.mini{width:72px;aspect-ratio:4/3;border-radius:6px;border:1px solid var(--line)}
.stage.mini::before{display:none}
.stage.mini .fb{padding:3px}

td.nw{white-space:nowrap}
.devs{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:760px){.devs{grid-template-columns:minmax(0,1fr)}}
.lt td.tn{width:88px;padding-block:7px}
.lt .nm{display:grid;gap:2px;justify-items:start}

/* ---------- charts & stats ---------- */
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:20px}
.sumc .pb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;padding-top:6px}
.mx{display:grid;gap:4px;min-width:0;align-content:start}
.mx b{font:500 22px/1.1 var(--sans);letter-spacing:-.01em;font-variant-numeric:lining-nums;color:var(--ink);white-space:nowrap}
.mx b small{font-size:13px;color:var(--faint);font-weight:400;margin-left:3px}
.cg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:20px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}

.lg .lt2{color:var(--muted)}
.ch .hit{fill:transparent;cursor:crosshair}
.ch .hit.hv{fill:color-mix(in oklab,var(--ink) 7%,transparent)}
.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}
.ln1{stroke:var(--c1)}.ln2{stroke:var(--c2)}.ln3{stroke:var(--c3)}.lni{stroke:var(--ink-2)}
.ch .halo{fill:none;stroke:var(--surface);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.ch .dsh{fill:none;stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.ch .cl2{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch .pk2{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.6}
#tip{position:fixed;left:0;top:0;z-index:70;pointer-events:none;min-width:170px;max-width:290px;padding:9px 11px;border-radius:8px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-2);font:12px/1.45 var(--sans);color:var(--ink-2)}
#tip .tt{font:500 11px/1.3 var(--mono);color:var(--muted);margin-bottom:6px}
#tip .tr{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:8px;padding:1px 0}
#tip .k{height:0;border-top:2px solid var(--ink-2)}
#tip .k.dl{border-top-style:dashed}
#tip b{font:500 12px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
details.dt{margin-top:14px}
details.dt summary{cursor:pointer;font-size:12.5px;color:var(--muted);width:max-content;max-width:100%}
details.dt summary:hover{color:var(--ink)}
details.dt[open] summary{margin-bottom:10px}
.gb .bu{grid-template-columns:minmax(118px,176px) minmax(0,1fr) 62px}
.gb .bl{display:grid;gap:1px}
.gb .bl .sub{font-size:11.5px;color:var(--faint)}
.bu.run .bt i{background:var(--accent)}
.bu.g .bt i{background:var(--ghost)}
.anl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}

.anl .d{font-size:12.5px;color:var(--muted);line-height:1.5}
.anl .tm{font:400 11px var(--mono);color:var(--faint)}
.anl li.rd .t,.anl li.rd .d{color:var(--faint)}

tfoot td{border-top:1px solid var(--line-2);border-bottom:0;font-weight:500;color:var(--ink)}
@media(max-width:1100px){.cg2{grid-template-columns:minmax(0,1fr)}.sum3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.anl li{grid-template-columns:auto minmax(0,1fr)}.anl li>.btn{grid-column:2;justify-self:start}.sumc .pb{gap:14px 12px}.mx b{font-size:19px}}

/* ---------- RSI subjects, evaluation, resources ---------- */
.rcp{display:grid;grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr);align-items:stretch;margin-bottom:20px}
.rcx .pb{display:grid;gap:8px;padding:16px 18px 18px;align-content:start}
.rcx .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rcx .rid{font:500 13px/1.4 var(--mono);color:var(--ink);overflow-wrap:anywhere}
.big2{font:400 40px/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.big2 small{font-size:.42em;color:var(--faint);margin-left:3px;letter-spacing:0}
.big2.pend{color:var(--faint)}
.rcx.cand{border-style:dashed;border-color:color-mix(in oklab,var(--accent) 45%,var(--line-2));box-shadow:none;background:color-mix(in oklab,var(--accent) 4%,var(--surface))}
.rcx .fx{display:grid;gap:2px;font-size:13px}
.rcx .fx .eb{font-size:10px}
.rul{position:relative;display:grid;align-content:center;justify-items:center;gap:6px;padding:12px 10px;text-align:center;font-size:12px;line-height:1.5;color:var(--muted)}

.rul>*{position:relative;background:var(--ground);padding:0 6px}
.keyrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:11px 14px;border-radius:var(--r3);border:1px solid var(--line);background:var(--ground-2);margin-bottom:20px;font-size:12.5px;color:var(--muted)}
.suites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:20px}
.suc .pb{display:grid;gap:14px}
.suc .rr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.vt{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vt li{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 8px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:12px;color:var(--muted);white-space:nowrap}
.vt li code{font-size:11px;color:var(--muted)}
.vt li b{font:500 12px var(--mono);color:var(--ink)}
.vt li i{width:6px;height:6px;border-radius:50%;background:var(--ghost);flex:none}
.vt li.ok i,.vt li.ref i{background:var(--ok)}.vt li.bad i{background:var(--bad)}.vt li.run i{background:var(--accent)}
.vt li.ref{background:color-mix(in oklab,var(--ok) 8%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ok) 40%,transparent)}
.vt li.bad b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.vt li.run b{color:var(--accent-ink);font-family:var(--sans);font-weight:500}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}

function spark(ser,lo,hi,o){o=o||{};const W=o.w||148,H=44,pt=5,pb=5,pr=24,N=ser.length-1,id='sp'+(UID++);const cl=v=>Math.max(lo,Math.min(hi,v)),X=i=>1+i/N*(W-pr-6),Y=v=>pt+(1-(cl(v)-lo)/(hi-lo))*(H-pt-pb);
const tone=o.stale?'var(--ghost)':o.alert?'var(--bad)':'var(--ink-2)';const L=ser.length-1,xe=X(L),ye=Y(ser[L]);
let g=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${o.alert?'var(--bad)':'var(--ink)'};stop-opacity:${o.stale?0:o.alert?.24:.13}"/><stop offset="1" style="stop-color:${o.alert?'var(--bad)':'var(--ink)'};stop-opacity:0"/></linearGradient></defs>`;
[lo,(lo+hi)/2,hi].forEach(v=>{g+=`<line class="sg" x1="0" x2="${W-pr+2}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`});
g+=`<text class="st-t" x="${W-pr+6}" y="${(Y(hi)+3).toFixed(1)}">${hi}</text><text class="st-t" x="${W-pr+6}" y="${(Y(lo)+1).toFixed(1)}">${lo}</text>`;
if(o.thr!=null)g+=`<line x1="0" x2="${W-pr+2}" y1="${Y(o.thr).toFixed(1)}" y2="${Y(o.thr).toFixed(1)}" style="stroke:var(--bad);stroke-width:1;stroke-dasharray:3 2;opacity:.8"/>`;
const pts=ser.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));
g+=`<path d="M${pts[0]} L${pts.join(' L')} L${xe.toFixed(1)},${H-pb} L${X(0).toFixed(1)},${H-pb}Z" fill="url(#${id})"/>`;
g+=`<polyline points="${pts.join(' ')}" style="fill:none;stroke:${tone};stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round${o.stale?';stroke-dasharray:2 2.5':''}"/>`;
g+=o.stale?`<circle cx="${xe.toFixed(1)}" cy="${ye.toFixed(1)}" r="2.6" style="fill:var(--surface);stroke:var(--ghost);stroke-width:1.2"/>`:`<circle cx="${xe.toFixed(1)}" cy="${ye.toFixed(1)}" r="5.5" style="fill:${tone};opacity:.18"/><circle cx="${xe.toFixed(1)}" cy="${ye.toFixed(1)}" r="2.6" style="fill:${tone}"/>`;
return `<svg class="spk" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"${o.w?' style="width:100%;height:auto;max-width:'+W+'px"':''} role="img" aria-label="1 小时趋势，范围 ${lo} 到 ${hi}">${g}</svg>`}
function chart(ser,max,title,unit,cur){const W=360,H=170,pl=34,pr=18,pt=18,pb=26,id='ch'+(UID++);const X=i=>pl+i/800*(W-pl-pr),Y=v=>H-pb-Math.max(0,v)/max*(H-pt-pb);
let g=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>`;
[0,.25,.5,.75,1].forEach(q=>{const y=Y(max*q).toFixed(1);g+=`<line class="${q?'cg':'cg0'}" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ct" x="${pl-8}" y="${(+y+3.5).toFixed(1)}" text-anchor="end">${Math.round(max*q)}</text>`});
[0,200,400,600,800].forEach(i=>{g+=`<text class="ct" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${i}</text>`});
const p=ser.map(q=>[X(q[0]),Y(q[1])]),xe=X(412),ye=Y(cur);
g+=`<path d="M${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' L')} L${xe.toFixed(1)},${H-pb} L${pl},${H-pb}Z" fill="url(#${id})"/>`;
g+=`<line class="cnow" x1="${xe.toFixed(1)}" x2="${xe.toFixed(1)}" y1="${pt-6}" y2="${H-pb}"/><text class="ct" x="${(xe+6).toFixed(1)}" y="${pt-1}">iter 412</text>`;
g+=`<polyline class="cl" points="${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"/><circle cx="${xe.toFixed(1)}" cy="${ye.toFixed(1)}" r="6" style="fill:var(--accent);opacity:.2"/><circle cx="${xe.toFixed(1)}" cy="${ye.toFixed(1)}" r="3" style="fill:var(--accent);stroke:var(--surface);stroke-width:1.5"/><text class="cv" x="${(xe+10).toFixed(1)}" y="${(ye+12).toFixed(1)}">${cur}${unit}</text>`;

function render(keep){VIEWS=[];TTN=0;for(const k in TT)delete TT[k];hideTip();const KS={};['tbody','wins'].forEach(i=>{const e=document.getElementById(i);if(e)KS[i]=e.scrollTop});const root=document.getElementById('root');root.innerHTML=view();for(const i in KS){const e=document.getElementById(i);if(e)e.scrollTop=KS[i]}if(S.wb.rv){S.wb.rv=0;const o=document.querySelector('#tbody .tr.on');if(o)o.scrollIntoView({block:'nearest'})}try{const h='#'+hashOf();if(location.hash!==h)history.replaceState(null,'',h)}catch(e){}if(!keep)window.scrollTo(0,0);if(G3){G3.mount();G3.tickEnv(RM?5:(performance.now()-T0)/1000)}else tickSVG()}
function railToggle(){S.rail=S.rail==='closed'?'open':'closed';try{localStorage.setItem('ls-rail',S.rail)}catch(e){}const A=document.querySelector('.A'),c=S.rail==='closed',l=c?'展开侧栏':'收起侧栏';if(A)A.classList.toggle('rc',c);const b=document.getElementById('rail-toggle');if(b){b.setAttribute('aria-expanded',String(!c));b.setAttribute('aria-label',l);b.dataset.tip=l;b.innerHTML=icon(c?'rexp':'rcol')+`<span class="nl">${l}</span>`}}
function act(a,d){let keep=true;
if(a==='rail'){railToggle();return}
if(a==='go'){S.pg={p:d.p,id:d.id||null};if(d.p==='res'&&d.id)S.res=d.id;S.eq=null;keep=false}
else if(a==='eq'){S.eq=d.id||null}
else if(a==='ap'||a==='rj'){const x=S.appr.find(z=>z.id===d.id);x.st=a==='ap'?'approved':'rejected'}
else if(a==='undo'){S.appr.find(z=>z.id===d.id).st='pending'}
else if(a==='launch'){S.launched[d.id]=true}
else if(a==='flag'){S.flags[d.k]=!S.flags[d.k]}
else if(a==='dev'){S.dev=d.id||null}
else if(a==='step'){S.step=+d.n}
else if(a==='ack'){const x=S.alerts.find(z=>z.id===d.id);x.ack=!x.ack}
else if(a==='copy'){try{Promise.resolve(navigator.clipboard.writeText(d.t)).catch(()=>{})}catch(e){}S.flags.copied=d.k}
else if(a==='lib'){S.lib[d.k]=d.v}
else if(a==='tab'){S.res=d.v}
else if(a==='subj'){S.subj=d.v}
else if(a==='range'){S.cost.range=d.v}
else if(a==='anom'){S.anom[d.id]=!S.anom[d.id]}
else if(a==='anomall'){AN.forEach(x=>{S.anom[x.id]=true})}
else if(a==='tsel'){S.wb.sel=d.id;ancOf(d.id).forEach(k=>S.wb.open.add(k));S.wb.rv=1}
else if(a==='wpk'){const k=d.id&&PK2T[d.id];if(k){S.wb.sel=k;ancOf(k).forEach(x=>S.wb.open.add(x));S.wb.rv=1}}
else if(a==='ttog'){const o=S.wb.open;if(o.has(d.id))o.delete(d.id);else o.add(d.id)}
else if(a==='tvis'){const h=S.wb.hid;if(h.has(d.id))h.delete(d.id);else h.add(d.id)}
else if(a==='tkf'){S.wb.kf=d.v;S.wb.rv=1}
else if(a==='tfold'){S.wb.open=new Set(['/World','/World/Lab'])}
else if(a==='tfocus'){S.wb.q='';S.wb.kf='all';ancOf(S.wb.sel).forEach(k=>S.wb.open.add(k));S.wb.rv=1}
else if(a==='wbt'){S.wb.tab=d.v}
else if(a==='wins'){S.wb.ins=d.v}
else if(a==='wcam'){S.wb.cam=d.v}
else if(a==='wly'){S.wb.ly[d.v]=!S.wb.ly[d.v]}
else if(a==='wbp'){S.wb.pz=!S.wb.pz}
else if(a==='wrtf'){S.wb.rtf=d.v}
else if(a==='theme'){let v=d.v;if(S.rail==='closed'&&window.innerWidth>900){const o=['system','light','dark'];v=o[(o.indexOf(themePref())+1)%3]}setTheme(v)}
const fid=document.activeElement&&document.activeElement.id;render(keep);if(keep&&fid){const el=document.getElementById(fid);if(el)try{el.focus({preventScroll:true})}catch(e){}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){act(t.dataset.a,t.dataset);return}
if(G3&&e.target.tagName==='CANVAS'){const el=e.target.closest('.stage.inter');if(!el)return;const id=G3.hit(el,e);if(id){const d=VIEWS[+el.dataset.view];act(d.inter,{id:(d.inter==='eq'&&S.eq===id)||(d.inter==='dev'&&S.dev===id)?'':id})}}});
let HOV=null;
function clearHov(){if(HOV&&HOV._hov){const h=HOV;h._hov=null;h.classList.remove('hov');h.querySelectorAll('.pin').forEach(x=>x.classList.remove('hv'));if(h.isConnected)G3.draw(h,true)}HOV=null}
document.addEventListener('pointermove',e=>{if(!G3)return;const el=e.target.tagName==='CANVAS'&&e.target.closest('.stage.inter');if(!el){if(HOV)clearHov();return}if(HOV&&HOV!==el)clearHov();HOV=el;const id=G3.hit(el,e);if(el._hov!==id){el._hov=id;el.classList.toggle('hov',!!id);el.querySelectorAll('.pin').forEach(x=>x.classList.toggle('hv',!!id&&x.dataset.id===id));G3.draw(el,true)}},{passive:true});
document.addEventListener('pointermove',e=>{const h=e.target&&e.target.closest?e.target.closest('.hit'):null;if(h)showTip(h,e.clientX,e.clientY);else if(THV)hideTip()},{passive:true});
document.addEventListener('pointerleave',hideTip);
window.addEventListener('scroll',()=>{if(THV)hideTip()},{passive:true});
document.addEventListener('input',e=>{const n=e.target&&e.target.dataset&&e.target.dataset.note;if(n)S.notes[n]=e.target.value;if(e.target&&e.target.dataset&&e.target.dataset.wbq){S.wb.q=e.target.value;const b=document.getElementById('tbody');if(b)b.innerHTML=tlist()}});
document.addEventListener('change',e=>{const t=e.target,k=t&&t.dataset&&t.dataset.cf;if(!k)return;S.cost[k]=t.value;if(k==='from'||k==='to')S.cost.range='custom';const id=t.id;render(true);const el=document.getElementById(id);if(el)try{el.focus({preventScroll:true})}catch(x){}});
window.addEventListener('resize',()=>{const n=window.innerWidth<640;if(n!==NARROW){NARROW=n;render(true)}},{passive:true});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='cost-dt')S.flags.dt=e.target.open},true);
document.addEventListener('keydown',e=>{const t=e.target;
if(t&&t.getAttribute&&t.getAttribute('role')==='tab'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const L=[...t.parentNode.querySelectorAll('[role=tab]')],n=L[(L.indexOf(t)+(e.key==='ArrowRight'?1:-1)+L.length)%L.length];e.preventDefault();act('tab',n.dataset);const el=document.getElementById(n.id);if(el)el.focus();return}
if(t&&t.getAttribute&&t.getAttribute('role')==='treeitem'){const L=[...document.querySelectorAll('#tbody .tr')],i=L.indexOf(t),id=t.dataset.id,ex=t.getAttribute('aria-expanded'),rid=k=>'tr-'+k.replace(/[^A-Za-z0-9]/g,'_');let n=null;
if(e.key==='ArrowDown')n=L[i+1];else if(e.key==='ArrowUp')n=L[i-1];
else if(e.key==='ArrowRight'&&ex==='false'){e.preventDefault();act('ttog',{id});return}
else if(e.key==='ArrowLeft'){if(ex==='true'){e.preventDefault();act('ttog',{id});return}const p=TIDX[id]&&TIDX[id].par;if(p)n=document.getElementById(rid(p))}
else if(e.key==='Enter'||e.key===' '){e.preventDefault();act('tsel',{id});return}
if(n){e.preventDefault();act('tsel',{id:n.dataset.id});const el=document.getElementById(n.id);if(el)el.focus()}return}
if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.dataset.a){e.preventDefault();act(t.dataset.a,t.dataset)}});
try{const t=localStorage.getItem('ls-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
try{const r=localStorage.getItem('ls-rail');if(r==='closed'||r==='open')S.rail=r}catch(e){}
if(window.matchMedia){const mq=matchMedia('(prefers-color-scheme: light)');const f=()=>{if(G3)G3.retheme()};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f)}
window.addEventListener('hashchange',()=>{if(location.hash.slice(1)===hashOf())return;if(fromHash())render(false)});
if(!RM)setInterval(()=>{const t=(performance.now()-T0)/1000;if(G3)G3.tickEnv(t);else tickSVG()},100);
if(G3&&document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>G3.retheme());
fromHash();render(false);
})();
